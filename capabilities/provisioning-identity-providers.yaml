naftiko: 1.0.0-alpha2
info:
  label: Commerce Layer Provisioning API — Identity Providers
  description: 'Manage identity providers for SSO/identity federation against the Commerce Layer organization.'
  tags:
  - Commerce Layer
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    COMMERCE_LAYER_PROVISIONING_ACCESS_TOKEN: COMMERCE_LAYER_PROVISIONING_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: provisioning-identity-providers
    baseUri: https://provisioning.commercelayer.io
    description: Commerce Layer Provisioning API — Identity Providers business surface.
    resources:
    - name: identity_providers
      path: /identity_providers
      operations:
      - name: listidentityproviders
        method: GET
        description: List All Identity Providers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createidentityprovider
        method: POST
        description: Create An Identity Provider
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
    - name: identity_providers-identityProviderId
      path: /identity_providers/{identityProviderId}
      operations:
      - name: retrieveidentityprovider
        method: GET
        description: Retrieve An Identity Provider
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updateidentityprovider
        method: PATCH
        description: Update An Identity Provider
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
      - name: deleteidentityprovider
        method: DELETE
        description: Delete An Identity Provider
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: oauth2
      flow: client_credentials
      tokenUrl: https://auth.commercelayer.io/oauth/token
      value: 'Bearer {{env.COMMERCE_LAYER_PROVISIONING_ACCESS_TOKEN}}'
      placement: header
      key: Authorization
  exposes:
  - type: rest
    namespace: provisioning-identity-providers-rest
    port: 8080
    description: REST adapter for Commerce Layer Provisioning API — Identity Providers.
    resources:
    - path: /api/identity_providers
      name: identity-providers
      operations:
      - method: GET
        name: listidentityproviders
        call: provisioning-identity-providers.listidentityproviders
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createidentityprovider
        call: provisioning-identity-providers.createidentityprovider
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /api/identity_providers/{identityProviderId}
      name: identity-providers-identityProviderId
      operations:
      - method: GET
        name: retrieveidentityprovider
        call: provisioning-identity-providers.retrieveidentityprovider
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updateidentityprovider
        call: provisioning-identity-providers.updateidentityprovider
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteidentityprovider
        call: provisioning-identity-providers.deleteidentityprovider
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: provisioning-identity-providers-mcp
    port: 9090
    transport: http
    description: MCP adapter for Commerce Layer Provisioning API — Identity Providers.
    tools:
    - name: commerce-layer-listidentityproviders
      description: List All Identity Providers
      hints:
        readOnly: true
        idempotent: true
        destructive: false
      call: provisioning-identity-providers.listidentityproviders
      outputParameters:
      - type: object
        mapping: $.
    - name: commerce-layer-createidentityprovider
      description: Create An Identity Provider
      hints:
        readOnly: false
        idempotent: false
        destructive: false
      call: provisioning-identity-providers.createidentityprovider
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: commerce-layer-retrieveidentityprovider
      description: Retrieve An Identity Provider
      hints:
        readOnly: true
        idempotent: true
        destructive: false
      call: provisioning-identity-providers.retrieveidentityprovider
      outputParameters:
      - type: object
        mapping: $.
    - name: commerce-layer-updateidentityprovider
      description: Update An Identity Provider
      hints:
        readOnly: false
        idempotent: true
        destructive: false
      call: provisioning-identity-providers.updateidentityprovider
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: commerce-layer-deleteidentityprovider
      description: Delete An Identity Provider
      hints:
        readOnly: false
        idempotent: true
        destructive: true
      call: provisioning-identity-providers.deleteidentityprovider
      outputParameters:
      - type: object
        mapping: $.
