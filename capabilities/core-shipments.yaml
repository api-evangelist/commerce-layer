        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /api/parcels
      name: parcels
      operations:
      - method: GET
        name: listparcels
        call: core-shipments.listparcels
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createparcel
