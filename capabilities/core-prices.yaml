naftiko: 1.0.0-alpha2
info:
  label: Commerce Layer Core API — Prices
  description: 'Price lists, prices, price tiers (volume, frequency), price list schedulers.'
  tags:
  - Commerce Layer
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    COMMERCE_LAYER_ACCESS_TOKEN: COMMERCE_LAYER_ACCESS_TOKEN
    COMMERCE_LAYER_ORG_SLUG: COMMERCE_LAYER_ORG_SLUG
capability:
  consumes:
  - type: http
    namespace: core-prices
    baseUri: https://{{env.COMMERCE_LAYER_ORG_SLUG}}.commercelayer.io/api
    description: Commerce Layer Core API — Prices business surface.
    resources:
    - name: price_lists
      path: /price_lists
      operations:
      - name: listpricelists
        method: GET
        description: List All Price Lists
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createpricelist
        method: POST
        description: Create A Price List
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
    - name: prices
      path: /prices
      operations:
      - name: listprices
        method: GET
        description: List All Prices
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createprice
        method: POST
        description: Create A Price
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
    - name: price_volume_tiers
      path: /price_volume_tiers
      operations:
      - name: listpricevolumetiers
        method: GET
        description: List All Price Volume Tiers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createpricevolumetier
        method: POST
        description: Create A Price Volume Tier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
    - name: price_frequency_tiers
      path: /price_frequency_tiers
      operations:
      - name: listpricefrequencytiers
        method: GET
        description: List All Price Frequency Tiers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createpricefrequencytier
        method: POST
        description: Create A Price Frequency Tier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
    authentication:
      type: oauth2
      flow: client_credentials
      tokenUrl: https://auth.commercelayer.io/oauth/token
      value: 'Bearer {{env.COMMERCE_LAYER_ACCESS_TOKEN}}'
      placement: header
      key: Authorization
  exposes:
  - type: rest
    namespace: core-prices-rest
    port: 8080
    description: REST adapter for Commerce Layer Core API — Prices.
    resources:
    - path: /api/price_lists
      name: price-lists
      operations:
      - method: GET
        name: listpricelists
        call: core-prices.listpricelists
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createpricelist
        call: core-prices.createpricelist
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /api/prices
      name: prices
      operations:
      - method: GET
        name: listprices
        call: core-prices.listprices
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createprice
        call: core-prices.createprice
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /api/price_volume_tiers
      name: price-volume-tiers
      operations:
      - method: GET
        name: listpricevolumetiers
        call: core-prices.listpricevolumetiers
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createpricevolumetier
        call: core-prices.createpricevolumetier
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /api/price_frequency_tiers
      name: price-frequency-tiers
      operations:
      - method: GET
        name: listpricefrequencytiers
        call: core-prices.listpricefrequencytiers
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createpricefrequencytier
        call: core-prices.createpricefrequencytier
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: core-prices-mcp
    port: 9090
    transport: http
    description: MCP adapter for Commerce Layer Core API — Prices.
    tools:
    - name: commerce-layer-listpricelists
      description: List All Price Lists
      hints:
        readOnly: true
        idempotent: true
        destructive: false
      call: core-prices.listpricelists
      outputParameters:
      - type: object
        mapping: $.
    - name: commerce-layer-createpricelist
      description: Create A Price List
      hints:
        readOnly: false
        idempotent: false
        destructive: false
      call: core-prices.createpricelist
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: commerce-layer-listprices
      description: List All Prices
      hints:
        readOnly: true
        idempotent: true
        destructive: false
      call: core-prices.listprices
      outputParameters:
      - type: object
        mapping: $.
    - name: commerce-layer-createprice
      description: Create A Price
      hints:
        readOnly: false
        idempotent: false
        destructive: false
      call: core-prices.createprice
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: commerce-layer-listpricevolumetiers
      description: List All Price Volume Tiers
      hints:
        readOnly: true
        idempotent: true
        destructive: false
      call: core-prices.listpricevolumetiers
      outputParameters:
      - type: object
        mapping: $.
    - name: commerce-layer-createpricevolumetier
      description: Create A Price Volume Tier
      hints:
        readOnly: false
        idempotent: false
        destructive: false
      call: core-prices.createpricevolumetier
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: commerce-layer-listpricefrequencytiers
      description: List All Price Frequency Tiers
      hints:
        readOnly: true
        idempotent: true
        destructive: false
      call: core-prices.listpricefrequencytiers
      outputParameters:
      - type: object
        mapping: $.
    - name: commerce-layer-createpricefrequencytier
      description: Create A Price Frequency Tier
      hints:
        readOnly: false
        idempotent: false
        destructive: false
      call: core-prices.createpricefrequencytier
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
