        destructive: false
      call: core-customers.createcustomeraddress
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: commerce-layer-listcustomergroups
      description: List All Customer Groups
      hints:
        readOnly: true
        idempotent: true
        destructive: false
      call: core-customers.listcustomergroups
      outputParameters:
      - type: object
        mapping: $.
    - name: commerce-layer-createcustomergroup
