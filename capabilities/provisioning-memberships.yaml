        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /api/permissions
      name: permissions
      operations:
      - method: GET
        name: listpermissions
        call: provisioning-memberships.listpermissions
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createpermission
        call: provisioning-memberships.createpermission
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /api/application_memberships
      name: application-memberships
      operations:
      - method: GET
        name: listapplicationmemberships
        call: provisioning-memberships.listapplicationmemberships
        outputParameters:
        - type: object
