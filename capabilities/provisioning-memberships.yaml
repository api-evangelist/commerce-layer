      - method: POST
        name: createapplicationmembership
        call: provisioning-memberships.createapplicationmembership
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /api/user_invitations
      name: user-invitations
      operations:
      - method: GET
        name: listuserinvitations
        call: provisioning-memberships.listuserinvitations
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createuserinvitation
        call: provisioning-memberships.createuserinvitation
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
