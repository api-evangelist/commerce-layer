}

# ─── Bulk Operations ──────────────────────────────────────────────────────────

"""A bulk import job that creates or updates resources from a data file."""
type Import implements Node {
  id: ID!
  type: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  resourceType: String!
  parentResourceId: String
  status: ImportStatus!
  cleanup: Boolean
  pending: Boolean
  inputs: JSON
  inputsSize: Int
  errorsCount: Int
  warningsCount: Int
  destroyedCount: Int
  processedCount: Int
  errorsLog: JSON
  warningsLog: JSON
  dryData: Boolean
  completedAt: DateTime
  interruptedAt: DateTime
  validationStrategy: String
}

"""A bulk export job that extracts resource data to a downloadable file."""
type Export implements Node {
  id: ID!
  type: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  resourceType: String!
  status: ExportStatus!
  includes: [String!]
  filters: JSON
  format: String
  dryData: Boolean
  started: Boolean
  attachmentUrl: String
  recordsCount: Int
  completedAt: DateTime
  interruptedAt: DateTime
}

# ─── Queries ──────────────────────────────────────────────────────────────────

type Query {
  # Organization
  organization: Organization

  # Markets
  market(id: ID!): Market
  markets(pageSize: Int, pageNumber: Int): [Market!]!

  # Catalog
  sku(id: ID!): SKU
  skus(pageSize: Int, pageNumber: Int, filterByCode: String): [SKU!]!
  skuOption(id: ID!): SKUOption
  skuOptions(pageSize: Int, pageNumber: Int): [SKUOption!]!
  bundle(id: ID!): Bundle
  bundles(pageSize: Int, pageNumber: Int): [Bundle!]!

  # Pricing
  priceList(id: ID!): PriceList
  priceLists(pageSize: Int, pageNumber: Int): [PriceList!]!
  price(id: ID!): Price
  prices(pageSize: Int, pageNumber: Int, filterBySkuCode: String): [Price!]!

  # Inventory
  inventoryModel(id: ID!): InventoryModel
  inventoryModels(pageSize: Int, pageNumber: Int): [InventoryModel!]!
  stockLocation(id: ID!): StockLocation
  stockLocations(pageSize: Int, pageNumber: Int): [StockLocation!]!
  stockItem(id: ID!): StockItem
  stockItems(pageSize: Int, pageNumber: Int, filterBySkuCode: String): [StockItem!]!
  stockTransfer(id: ID!): StockTransfer
  stockTransfers(pageSize: Int, pageNumber: Int): [StockTransfer!]!

  # Orders
  order(id: ID!): Order
  orders(pageSize: Int, pageNumber: Int, filterByStatus: OrderStatus, filterByCustomerEmail: String): [Order!]!
  lineItem(id: ID!): LineItem
  lineItems(orderId: ID, pageSize: Int, pageNumber: Int): [LineItem!]!

  # Promotions
  promotion(id: ID!): Promotion
  promotions(pageSize: Int, pageNumber: Int): [Promotion!]!
  coupon(id: ID!): Coupon
  coupons(pageSize: Int, pageNumber: Int): [Coupon!]!
  giftCard(id: ID!): GiftCard
  giftCards(pageSize: Int, pageNumber: Int): [GiftCard!]!

  # Customers
  customer(id: ID!): Customer
  customers(pageSize: Int, pageNumber: Int, filterByEmail: String): [Customer!]!
  customerGroup(id: ID!): CustomerGroup
  customerGroups(pageSize: Int, pageNumber: Int): [CustomerGroup!]!

  # Addresses
  address(id: ID!): Address
  addresses(pageSize: Int, pageNumber: Int): [Address!]!

  # Payments
  paymentMethod(id: ID!): PaymentMethod
  paymentMethods(pageSize: Int, pageNumber: Int): [PaymentMethod!]!
  transaction(id: ID!): Transaction
  transactions(orderId: ID, pageSize: Int, pageNumber: Int): [Transaction!]!
  authorization(id: ID!): Authorization
  capture(id: ID!): Capture
  void(id: ID!): Void
  refund(id: ID!): Refund

  # Tax
  taxCalculator(id: ID!): TaxCalculator
  taxCalculators(pageSize: Int, pageNumber: Int): [TaxCalculator!]!
  taxCategory(id: ID!): TaxCategory
  taxCategories(pageSize: Int, pageNumber: Int): [TaxCategory!]!

  # Shipping
  shipment(id: ID!): Shipment
  shipments(orderId: ID, pageSize: Int, pageNumber: Int): [Shipment!]!
  shippingMethod(id: ID!): ShippingMethod
  shippingMethods(pageSize: Int, pageNumber: Int): [ShippingMethod!]!
  shippingZone(id: ID!): ShippingZone
  shippingZones(pageSize: Int, pageNumber: Int): [ShippingZone!]!
  parcel(id: ID!): Parcel
  parcels(shipmentId: ID, pageSize: Int, pageNumber: Int): [Parcel!]!

  # Returns
  return(id: ID!): Return
  returns(pageSize: Int, pageNumber: Int, filterByStatus: ReturnStatus): [Return!]!

  # Webhooks
  webhook(id: ID!): Webhook
  webhooks(pageSize: Int, pageNumber: Int): [Webhook!]!

  # Bulk
  import(id: ID!): Import
  imports(pageSize: Int, pageNumber: Int): [Import!]!
  export(id: ID!): Export
  exports(pageSize: Int, pageNumber: Int): [Export!]!
}

# ─── Input types ─────────────────────────────────────────────────────────────

input CreateOrderInput {
  marketId: ID!
  customerEmail: String
  languageCode: String
  countryCode: String
  couponCode: String
  giftCardCode: String
}

input UpdateOrderInput {
  id: ID!
  customerEmail: String
  shippingAddressId: ID
  billingAddressId: ID
  paymentMethodId: ID
  couponCode: String
  giftCardCode: String
  _place: Boolean
  _approve: Boolean
  _cancel: Boolean
  _refresh: Boolean
  _approve_and_capture: Boolean
}

input CreateLineItemInput {
  orderId: ID!
  skuCode: String
  bundleCode: String
  quantity: Int!
  name: String
  imageUrl: String
  unitAmountCents: Int
}

input CreateSkuInput {
  code: String!
  name: String!
  description: String
  imageUrl: String
  shippingCategoryId: ID!
  doNotShip: Boolean
  doNotTrack: Boolean
  weight: Float
  unitOfWeight: String
}

input CreateAddressInput {
  firstName: String
  lastName: String
  company: String
  line1: String!
  line2: String
  city: String!
  zipCode: String!
  stateCode: String
  countryCode: String!
  phone: String
  email: String
}

input CreateShipmentInput {
  orderId: ID!
  stockLocationId: ID!
  shippingMethodId: ID
}

input CreateReturnInput {
  orderId: ID!
  stockLocationId: ID
}

# ─── Mutations ───────────────────────────────────────────────────────────────

type Mutation {
  # Orders
  createOrder(input: CreateOrderInput!): Order
  updateOrder(input: UpdateOrderInput!): Order
  deleteOrder(id: ID!): Boolean

  # Line items
  createLineItem(input: CreateLineItemInput!): LineItem
  updateLineItem(id: ID!, quantity: Int, name: String): LineItem
  deleteLineItem(id: ID!): Boolean

  # SKUs
  createSku(input: CreateSkuInput!): SKU
  updateSku(id: ID!, name: String, description: String, imageUrl: String): SKU
  deleteSku(id: ID!): Boolean

  # Addresses
  createAddress(input: CreateAddressInput!): Address
  updateAddress(id: ID!, input: CreateAddressInput!): Address
  deleteAddress(id: ID!): Boolean

  # Shipments
  createShipment(input: CreateShipmentInput!): Shipment
  updateShipment(id: ID!, shippingMethodId: ID, _ready_to_ship: Boolean, _ship: Boolean): Shipment
  deleteShipment(id: ID!): Boolean

  # Returns
  createReturn(input: CreateReturnInput!): Return
  updateReturn(id: ID!, _request: Boolean, _approve: Boolean, _cancel: Boolean, _ship: Boolean, _receive: Boolean, _reject: Boolean, _restock: Boolean, _archive: Boolean): Return
  deleteReturn(id: ID!): Boolean

  # Promotions
  createPromotion(name: String!, promotionType: PromotionType!, startsAt: DateTime, expiresAt: DateTime, totalUsageLimit: Int): Promotion
  updatePromotion(id: ID!, name: String, active: Boolean, expiresAt: DateTime): Promotion
  deletePromotion(id: ID!): Boolean

  # Coupons
  createCoupon(promotionId: ID!, code: String!, usageLimit: Int, recipientEmail: String): Coupon
  deleteCoupon(id: ID!): Boolean

  # Webhooks
  createWebhook(name: String!, topic: String!, callbackUrl: String!, includeResources: [String!]): Webhook
  updateWebhook(id: ID!, name: String, disabled: Boolean, callbackUrl: String, includeResources: [String!]): Webhook
  deleteWebhook(id: ID!): Boolean

  # Imports
  createImport(resourceType: String!, inputs: JSON!, cleanup: Boolean, dryData: Boolean): Import

  # Exports
  createExport(resourceType: String!, filters: JSON, includes: [String!], format: String, dryData: Boolean): Export

  # Customers
  createCustomer(email: String!, password: String): Customer
  updateCustomer(id: ID!, email: String, customerGroupId: ID): Customer
  deleteCustomer(id: ID!): Boolean
}
