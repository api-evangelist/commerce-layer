  name: String!
  description: String
  imageUrl: String
  pieces_per_pack: Int
  weight: Float
  unitOfWeight: String
  hsTariffNumber: String
  doNotShip: Boolean
  doNotTrack: Boolean
  modeOfTransportation: String
  shippingCategory: ShippingCategory
  skuOptions: [SKUOption!]
  prices: [Price!]
  stockItems: [StockItem!]
  tags: [Tag!]
}

"""An add-on option that can be attached to a line item."""
type SKUOption implements Node {
  id: ID!
  type: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  name: String!
  description: String
  currencyCode: String
  priceAmountCents: Int
  priceAmountFloat: Float
  formattedPriceAmount: String
  skuOptionType: String
  material: String
  colorCode: String
  imageUrl: String
  attachmentUrl: String
}

"""A grouping of products sold together at a special price."""
type Bundle implements Node {
  id: ID!
  type: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  code: String!
  name: String!
  description: String
  imageUrl: String
  currencyCode: String
  priceAmountCents: Int
  priceAmountFloat: Float
  formattedPriceAmount: String
  compareAtAmountCents: Int
  compareAtAmountFloat: Float
  doNotShip: Boolean
  doNotTrack: Boolean
  priceList: PriceList
  skuList: SKUList
  bundleItems: [BundleItem!]
  skus: [SKU!]
