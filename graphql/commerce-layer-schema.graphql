"""
Commerce Layer GraphQL Schema
Conceptual GraphQL translation of the Commerce Layer JSON:API REST surface.
Source: https://docs.commercelayer.io/core-api-reference/
OpenAPI: https://data.commercelayer.app/schemas/openapi.json
"""

scalar DateTime
scalar JSON

# ─── Enums ───────────────────────────────────────────────────────────────────

enum OrderStatus {
  DRAFT
  PENDING
  PLACED
  APPROVED
  CANCELLED
  PAYMENT_GATING
}

enum ShipmentStatus {
  UPCOMING
  CANCELLED
  PICKING
  PACKING
  READY_TO_SHIP
  SHIPPED
  DELIVERED
}

enum ReturnStatus {
  DRAFT
  REQUESTED
  APPROVED
  CANCELLED
  SHIPPED
  RECEIVED
  REJECTED
  REFUNDED
  ARCHIVED
}

enum TransactionType {
  AUTHORIZATION
  CAPTURE
  VOID
  REFUND
}

enum ImportStatus {
  PENDING
  IN_PROGRESS
  COMPLETED
  INTERRUPTED
}

enum ExportStatus {
  PENDING
  IN_PROGRESS
  COMPLETED
  INTERRUPTED
}

enum PromotionType {
  PERCENTAGE_DISCOUNT
  FIXED_AMOUNT
  FIXED_PRICE
  FREE_GIFT
  FREE_SHIPPING
  BUY_X_PAY_Y
  EXTERNAL
  FLEX
}

enum PaymentSourceType {
  STRIPE_PAYMENT
  ADYEN_PAYMENT
  BRAINTREE_PAYMENT
  PAYPAL_PAYMENT
  KLARNA_PAYMENT
  CHECKOUT_COM_PAYMENT
  AXERVE_PAYMENT
  SATISPAY_PAYMENT
  EXTERNAL_PAYMENT
  MANUAL_PAYMENT
  GIFT_CARD
}

enum TaxCalculatorType {
  MANUAL
  AVALARA
  TAXJAR
  VERTEX
  STRIPE_TAX
  EXTERNAL
}

enum EnvironmentMode {
  LIVE
  TEST
}

# ─── Common interfaces ────────────────────────────────────────────────────────

interface Node {
  id: ID!
  type: String!
  createdAt: DateTime!
  updatedAt: DateTime!
}

# ─── Organization / Tenancy ───────────────────────────────────────────────────

"""Top-level tenant configuration returned by the provisioning surface."""
type Organization implements Node {
  id: ID!
  type: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  name: String!
  slug: String!
  domain: String
  supportPhone: String
  supportEmail: String
  logoUrl: String
  faviconUrl: String
  primaryColor: String
  contrastColor: String
  gtmId: String
  gtm_id_test: String
  countryCodes: [String!]
  currencyCodes: [String!]
  orderSubjects: JSON
  markets: [Market!]
}

"""A selling context with its own price list, inventory model, and payment/shipping configuration."""
type Market implements Node {
  id: ID!
  type: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  name: String!
  number: Int
  facebookPixelId: String
  checkoutUrl: String
  externalPricesUrl: String
  privacyUrl: String
  cookiesUrl: String
  defaultCountryCode: String
  georestrictions: Boolean
  enabled: Boolean
  shared: Boolean
  organization: Organization
  merchant: Merchant
  priceList: PriceList
  inventoryModel: InventoryModel
  taxCalculator: TaxCalculator
  customerGroup: CustomerGroup
  stores: [Store!]
  paymentMethods: [PaymentMethod!]
  shippingMethods: [ShippingMethod!]
}

"""A commerce channel (e.g. web, mobile, in-store kiosk)."""
type Channel implements Node {
  id: ID!
  type: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  name: String!
  code: String
  description: String
  market: Market
}

"""Payment/merchant account configuration."""
type Merchant implements Node {
  id: ID!
  type: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  name: String!
  addresses: [Address!]
}

"""A physical or virtual storefront within a market."""
type Store implements Node {
  id: ID!
  type: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  name: String!
  code: String
  market: Market
}

# ─── Catalog ──────────────────────────────────────────────────────────────────

"""A Stock Keeping Unit representing a sellable product variant."""
type SKU implements Node {
  id: ID!
  type: String!
  createdAt: DateTime!
  updatedAt: DateTime!
