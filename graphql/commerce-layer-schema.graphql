  sku: SKU
}

"""Logical grouping category used for shipping rules."""
type ShippingCategory implements Node {
  id: ID!
  type: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  name: String!
  skus: [SKU!]
  shippingMethods: [ShippingMethod!]
}

"""A reusable label attached to any Commerce Layer resource."""
type Tag implements Node {
  id: ID!
  type: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  name: String!
}

# ─── Pricing ──────────────────────────────────────────────────────────────────

"""A catalog of prices for a set of SKUs, scoped to a currency."""
type PriceList implements Node {
  id: ID!
  type: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  name: String!
  currencyCode: String!
  taxIncluded: Boolean
  rules: JSON
  markets: [Market!]
  prices: [Price!]
}

"""The selling price of a SKU in a price list."""
type Price implements Node {
  id: ID!
  type: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  currencyCode: String!
  skuCode: String
  amountCents: Int!
  amountFloat: Float!
  formattedAmount: String!
  compareAtAmountCents: Int
  compareAtAmountFloat: Float
  formattedCompareAtAmount: String
  priceList: PriceList
  sku: SKU
