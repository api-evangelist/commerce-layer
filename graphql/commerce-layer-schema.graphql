}

"""A quantity-based price tier attached to a Price."""
type PriceTier implements Node {
  id: ID!
  type: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  name: String!
  upToQuantity: Int
  priceAmountCents: Int!
  priceAmountFloat: Float!
  formattedPriceAmount: String!
  price: Price
}

"""A named list of SKUs used by bundles and promotions."""
type SKUList implements Node {
  id: ID!
  type: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  name: String!
  description: String
  imageUrl: String
  manual: Boolean
  skuCode: String
  rules: JSON
  skus: [SKU!]
  skuListItems: [SKUListItem!]
}

"""A single SKU entry inside an SKUList."""
type SKUListItem implements Node {
  id: ID!
  type: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  position: Int
  quantity: Int
  skuList: SKUList
  sku: SKU
}

# ─── Inventory ────────────────────────────────────────────────────────────────

