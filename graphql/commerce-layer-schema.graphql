  id: ID!
  type: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  name: String!
  topic: String!
  callbackUrl: String!
  includeResources: [String!]
  disabled: Boolean
  circuit: String
  circuitState: String
  failureCount: Int
  lastEventCallbacks: [EventCallback!]
}

