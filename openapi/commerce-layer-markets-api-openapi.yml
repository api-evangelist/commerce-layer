openapi: 3.2.0
info:
  title: Commerce Layer Markets API
  version: 7.10.1
  contact:
    name: API Support
    url: https://commercelayer.io
    email: support@commercelayer.io
  description: Headless Commerce for Global Brands.
servers:
- url: https://{your_organization_slug}.commercelayer.io/api
  description: API
- url: https://core.commercelayer.io/users/sign_in
  description: Sign in
- url: https://docs.commercelayer.io/api
  description: API reference
security:
- bearerAuth: []
tags:
- name: markets
  description: resource type
paths:
  /markets:
    get:
      operationId: GET/markets
      summary: List all markets
      description: List all markets
      tags:
      - markets
      responses:
        '200':
          description: A list of market objects
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/marketResponseList'
    post:
      operationId: POST/markets
      summary: Create a market
      description: Create a market
      tags:
      - markets
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/marketCreate'
      responses:
        '201':
          description: The created market object
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/marketResponse'
  /markets/{marketId}:
    get:
      operationId: GET/markets/marketId
      summary: Retrieve a market
      description: Retrieve a market
      tags:
      - markets
      parameters:
      - name: marketId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      responses:
        '200':
          description: The market object
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/marketResponse'
    patch:
      operationId: PATCH/markets/marketId
      summary: Update a market
      description: Update a market
      tags:
      - markets
      parameters:
      - name: marketId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/marketUpdate'
      responses:
        '200':
          description: The updated market object
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/marketResponse'
    delete:
      operationId: DELETE/markets/marketId
      summary: Delete a market
      description: Delete a market
      tags:
      - markets
      parameters:
      - name: marketId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      responses:
        '204':
          description: No content
