tags:
- name: addresses
  description: resource type
paths:
  /addresses:
    get:
      operationId: GET/addresses
      summary: List all addresses
      description: List all addresses
      tags:
      - addresses
      responses:
        '200':
          description: A list of address objects
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/addressResponseList'
    post:
      operationId: POST/addresses
      summary: Create an address
      description: Create an address
      tags:
      - addresses
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/addressCreate'
      responses:
        '201':
          description: The created address object
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/addressResponse'
  /addresses/{addressId}:
    get:
      operationId: GET/addresses/addressId
      summary: Retrieve an address
      description: Retrieve an address
      tags:
      - addresses
      parameters:
      - name: addressId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      responses:
        '200':
          description: The address object
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/addressResponse'
    patch:
      operationId: PATCH/addresses/addressId
      summary: Update an address
      description: Update an address
      tags:
      - addresses
      parameters:
      - name: addressId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/addressUpdate'
      responses:
        '200':
          description: The updated address object
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/addressResponse'
    delete:
      operationId: DELETE/addresses/addressId
      summary: Delete an address
      description: Delete an address
      tags:
      - addresses
      parameters:
      - name: addressId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      responses:
        '204':
          description: No content
