  /carts/stats:
    post:
      operationId: POST/carts/stats
      summary: Query stats on carts
      description: "Stats are aggregations that summarize your data within an operator (depending of the field, some of them could not be available), such as: value_count, cardinality, avg, min, max, sum or stats (which returns avg, min, max, sum) computed on the field specificed. When performing a stats query on the Metrics API endpoint you get in the response the value of the computation (based on the selected operator) on the selected field.\n\nStats request\n\n`{\n\t \"stats\": {\n        \"field\": \"order.total_amount_cents\",\n        \"operator\": \"stats\"\n    }\n}`"
