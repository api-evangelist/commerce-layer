  /carts/date_breakdown:
    post:
      operationId: POST/carts/date_breakdown
      summary: Query date_breakdown on carts
      description: "Date breakdowns summarizes metrics data grouped by time intervals on a defined time range. They also support support breakdowns over the main date breakdown query and also supports all breakdown queries capabilities through the \"breakdown\" key, this also includes the possibility of nesting the breakdown over the main breakdown. \n\n\nSingle date breakdown request (no breakdown)\n\n`{\n\t\"date_breakdown\": {\n        \"by\": \"order.created_at\",\n        \"field\": \"order.total_amount_with_taxes\",\n        \"operator\": \"stats\",\n        \"interval\": \"year\"\n    }\n}`\n  \n  \nSingle date breakdown request with one breakdown\n \n` \n{\n\t\"date_breakdown\": {\n        \"by\": \"order.created_at\",\n        \"field\": \"order.total_amount_with_taxes\",\n        \"operator\": \"stats\",\n        \"interval\": \"year\",\n        \"breakdown\": {\n            \"by\": \"order.customer_type\",\n            \"field\": \"line_items.total_amount\",\n            \"operator\": \"sum\",\n            \"sort\": \"desc\",\n            \"limit\": 20\n        }\n    }\n  }`\n  \n  \nSingle date breakdown request with breakdown with a nested breakdown\n\n` \n\"date_breakdown\": {\n        \"by\": \"order.created_at\",\n        \"field\": \"order.total_amount_with_taxes\",\n        \"operator\": \"stats\",\n        \"interval\": \"year\",\n        \"breakdown\": {\n            \"by\": \"order.customer_type\",\n            \"field\": \"line_items.total_amount\",\n            \"operator\": \"sum\",\n            \"sort\": \"desc\",\n            \"limit\": 20,\n            \"breakdown\": {\n                \"by\": \"order.currency_code\",\n                \"field\": \"line_items.total_amount\",\n                \"operator\": \"sum\",\n                \"sort\": \"desc\",\n                \"limit\": 21\n            }\n        }\n    }\n }`"
      tags:
      - carts
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/carts_date_breakdown_request'
      responses:
        '200':
          description: The date_breakdown result from carts
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
