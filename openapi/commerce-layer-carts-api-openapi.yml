  /carts/search:
    post:
      operationId: POST/carts/search
      summary: Query search on carts
      description: Get search results from carts
      tags:
      - carts
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/carts_search_request'
      responses:
        '200':
          description: The search result from carts
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        date_from:
                          type: string
                          description: The lower limit of the date and time range used to filter the collected orders (complete date plus hours, minutes and seconds — according to the [ISO 8601](https://www.w3.org/TR/NOTE-datetime) standard).
                          format: '%Y-%m-%dT%H:%M:%SZ'
                          example: '2022-07-06T21:41:03Z'
                        date_to:
                          type: string
                          description: The upper limit of the date and time range used to filter the collected orders (complete date plus hours, minutes and seconds — according to the [ISO 8601](https://www.w3.org/TR/NOTE-datetime) standard).
                          format: '%Y-%m-%dT%H:%M:%SZ'
                          example: '2022-07-06T21:41:03Z'
                        date_field:
                          type: string
                          description: The date field (e.g. `created_at`, `updated_at`, etc.) where to apply the date and time range filter.
                          enum:
                          - current_date
                          - created_at
                          - updated_at
                          default: current_date
                        discounted:
                          type: boolean
                          description: Indicates a discount has been applied to the order.
                        gift_card:
                          type: boolean
                          description: Indicates if a gift card has been (or is set to be) used to pay — in total or in part - for the order.
                        payment_statuses:
                          type: string
                          description: The order's payment status. Always `unpaid` for carts.
                        fulfillment_statuses:
                          type: string
                          description: The order's fulfillment status. Aways `unfulfilled` for carts.
                        coupon:
                          type: boolean
                          description: Indicates if a coupon code has been (or is set to be) used to pay — in total or in part — for the order.
                        customer_types:
                          type: string
                          description: The type of the associated customer. One of `new` or `returning`.
                        options:
                          type: boolean
                          description: Indicates if at least one line item of the order has at least an option.
                        adjustment_amount:
                          type: number
                          description: The sum of all the adjustments applied to the order (float).
                          example: 121
                        adjustment_tax_amount:
                          type: number
                          description: The taxes applied to the order's adjustments (float).
                          example: 121
                        adjustment_taxable_amount:
                          type: number
                          description: The order's adjustment taxable amount (float).
                          example: 121
                        country_codes:
                          type: string
                          description: The international 2-letter country code (as defined by the [ISO 3166-1](https://en.wikipedia.org/wiki/ISO_3166-1) standard), automatically inherited from the order's shipping address.
                        coupon_codes:
                          type: string
                          description: The coupon code to be used to pay — in total or in part — for the order. If valid, it triggers a promotion adding a discount line item to the order.
                        created_at:
                          type: string
                          description: The date and time at which the order was created (complete date plus hours, minutes and seconds — according to the [ISO 8601](https://www.w3.org/TR/NOTE-datetime) standard).
                          format: '%Y-%m-%dT%H:%M:%SZ'
                          example: '2022-07-06T21:41:03Z'
                        currency_codes:
                          type: string
                          description: The international 3-letter currency code (as defined by the [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) standard), automatically inherited from the order's market.
                        discount_amount:
                          type: number
                          description: The sum of all the discounts applied to the order (float).
                          example: 121
                        duty_amount:
                          type: number
                          description: The duty amount that is calculated by external services (float).
                          example: 121
                        freight_taxable:
                          type: boolean
                          description: Indicates if taxes are applied to shipping costs.
                        gift_card_codes:
                          type: string
                          description: The gift card code (at least the first 8 characters) to be used to pay — in total or in part — for the order. If valid, it uses the associated gift card balance.
                        gift_card_amount:
                          type: number
                          description: The sum of all the gift cards applied to the order (float).
                          example: 121
                        guest:
                          type: boolean
                          description: Indicates if the order has been placed as guest (by a non-logged in customer).
                        ids:
                          type: string
                          description: The ID of the order.
                        language_codes:
                          type: string
                          description: The preferred language code (as defined by the [ISO 639-1](https://en.wikipedia.org/wiki/List_of_ISO_639-1_codes) standard) to be used when communicating with the customer when checking out the order.
                        line_item_options_count:
                          type: integer
                          description: The total number of line item options associated with the order's line items.
                          example: 8
                        mode:
                          type: string
                          description: The order's environment (can be one of `test` or `live`).
                          enum:
                          - live
                          - test
                        numbers:
                          type: integer
                          description: The numeric unique identifier for the order.
                          example: 8
                        payment_method_amount:
                          type: number
                          description: The costs of the payment method associated with the order (float).
                          example: 121
                        payment_method_tax_amount:
                          type: number
                          description: The taxes applied to the order's payment method costs (float).
                          example: 121
                        payment_method_taxable_amount:
                          type: number
                          description: The order's payment method taxable amount (float).
                          example: 121
                        references:
                          type: string
                          description: Any external identifier that might be useful to link the order resource to other systems through the Commerce Layer core API.
                        reference_origins:
                          type: string
                          description: Any identifier of the 3rd-party system that defines the reference code.
                        shipments_count:
                          type: integer
                          description: The total number of shipments associated with the order.
                          example: 8
                        shipping_amount:
                          type: number
                          description: The sum of all the shipping costs of the order (float).
                          example: 121
                        shipping_taxable_amount:
                          type: number
                          description: The order's shipping taxable amount (float).
                          example: 121
                        skus_count:
                          type: integer
                          description: The total number of SKUs in the order's line items.
                          example: 8
                        statuses:
                          type: string
                          description: The order status. One of `draft` (default), `pending`.
                        subtotal_amount:
                          type: number
                          description: The sum of all the SKU line items total amounts (float).
                          example: 121
                        subtotal_tax_amount:
                          type: number
                          description: The taxes applied to the order's subtotal (float).
                          example: 121
                        subtotal_taxable_amount:
                          type: number
                          description: The order's subtotal taxable amount (float).
                          example: 121
                        tax_included:
                          type: boolean
                          description: Indicates if taxes are included in the order amounts (automatically inherited from the order's price list).
                        total_amount:
                          type: number
                          description: The order's total amount (float).
                          example: 121
                        total_amount_with_taxes:
                          type: number
                          description: The order's total amount, taxes included (float).
                          example: 121
                        total_tax_amount:
                          type: number
                          description: The sum of all the taxes applied to the order (float).
                          example: 121
                        total_taxable_amount:
                          type: number
                          description: The order's total taxable amount (float).
                          example: 121
                        updated_at:
                          type: string
                          description: The date and time at which the order was last updated (complete date plus hours, minutes and seconds — according to the [ISO 8601](https://www.w3.org/TR/NOTE-datetime) standard).
                          format: '%Y-%m-%dT%H:%M:%SZ'
                          example: '2022-07-06T21:41:03Z'
                        current_date:
                          type: string
                          description: The date and time of the order's latest status change, regardless of the order's status (complete date plus hours, minutes and seconds — according to the [ISO 8601](https://www.w3.org/TR/NOTE-datetime) standard).
                          format: '%Y-%m-%dT%H:%M:%SZ'
                          example: '2022-07-06T21:41:03Z'
                        aggregated_details:
                          type: string
                          description: Searchable field containing all carts data.
                        link_ids:
                          type: string
                          description: The link ID used during the checkout.
                        user_ids:
                          type: string
                          description: The user ID used to generate the link.
                        store_ids:
                          type: string
                          description: The store ID used during the checkout.
                        affiliate_codes:
                          type: string
                          description: The affiliate code used during the checkout.
                        billing_address:
                          type: object
                          properties:
                            business:
                              type: boolean
                              description: Indicates if the address is a business or a personal one.
                            city:
                              type: string
                              description: The city specified in the address.
                            country_code:
                              type: string
                              description: The international 2-letter country code (as defined by the [ISO 3166-1](https://en.wikipedia.org/wiki/ISO_3166-1) standard) specified in the address.
                            geocoded:
                              type: boolean
                              description: Indicates if the address has been successfully geocoded.
                            localized:
                              type: boolean
                              description: Indicates if the latitude and longitude of the address are present, either geocoded or manually updated.
                            state_code:
                              type: string
                              description: The state, province or region code specified in the address.
                            zip_code:
                              type: string
                              description: The ZIP or postal code specified in the address.
                        customer:
                          type: object
                          properties:
                            id:
                              type: string
                              description: The ID of the customer.
                            email:
                              type: string
                              description: The email address of the customer.
                            group_name:
                              type: string
                              description: The name of the customer group the customer belongs to (if any).
                            reference:
                              type: string
                              description: Any external identifier that might be useful to link the customer resource to other systems through the Commerce Layer core API.
                            reference_origin:
                              type: string
                              description: Any identifier of the 3rd-party system that defines the reference code.
                        line_items:
                          type: object
                          properties:
                            code:
                              type: string
                              description: The code of the associated SKU or bundle.
                            discount:
                              type: number
                              description: The discount applied to the line item (float).
                              example: 121
                            id:
                              type: string
                              description: The ID of the line item.
                            item_id:
                              type: string
                              description: The ID of the associated item.
                            item_type:
                              type: string
                              description: The type of the associated item. One of `sku`, `bundle`, `shipment`, `payment_method`, `adjustment`, `gift_card`, or a valid promotion type (e.g. `percentage_discount_promotion`, `free_shipping_promotion`, etc.).
                            name:
                              type: string
                              description: The name of the line item. When missing, it gets populated with the name of the associated item (if present).
                            options_amount:
                              type: number
                              description: The amount of the line item option (float).
                              example: 121
                            quantity:
                              type: integer
                              description: The line item's quantity.
                              example: 8
                            tax_amount:
                              type: number
                              description: The collected tax amount for the line item (float). Otherwise calculated as the line item's `(total_amount - discount) * tax_rate` (float).
                              example: 121
                            tax_rate:
                              type: number
                              description: The tax rate for the line item (if calculated).
                              example: 121
                            total_amount:
                              type: number
                              description: The total amount of the line item (float). Calculated as the line item's `unit_amount * quantity` + plus the associated line item options amount.
                              example: 121
                            unit_amount:
                              type: number
                              description: The unit amount of the line item (float).
                              example: 121
                            updated_at:
                              type: string
                              description: The date and time at which the line item was last updated (complete date plus hours, minutes and seconds — according to the [ISO 8601](https://www.w3.org/TR/NOTE-datetime) standard).
                              format: '%Y-%m-%dT%H:%M:%SZ'
                              example: '2022-07-06T21:41:03Z'
                        line_items.options:
                          type: object
                          properties:
                            id:
                              type: string
                              description: The ID of the line item option.
                            name:
                              type: string
                              description: The name of the line item option. When missing, it gets populated with the name of the associated SKU option.
                            quantity:
                              type: integer
                              description: The line item option's quantity.
                              example: 8
                            total_amount:
                              type: number
                              description: The total amount of the line item option (float). Calculated as the line item option's `unit_amount * quantity`.
                              example: 121
                            unit_amount:
                              type: number
                              description: The unit amount of the line item option (float).
                              example: 121
                        market:
                          type: object
                          properties:
                            id:
                              type: string
                              description: The ID of the market.
                            name:
                              type: string
                              description: The name of the market.
                            number:
                              type: integer
                              description: The numeric unique identifier for the market.
                              example: 8
                        organization:
                          type: object
                          properties:
                            id:
                              type: string
                              description: The ID of the organization.
                            name:
                              type: string
                              description: The name of the organization.
                            slug:
                              type: string
                              description: The name of the organization, parsed and converted into a URL-friendly slug.
                        payment_method:
                          type: object
                          properties:
                            id:
                              type: string
                              description: The ID of the payment method.
                            source_type:
                              type: string
                              description: The payment source type. One of `AdyenPayment`, `BraintreePayment`, `CheckoutComPayment`, `CreditCard`, `ExternalPayment`, `KlarnaPayment`, `PaypalPayment`, `StripePayment`, or `WireTransfer`.
                            name:
                              type: string
                              description: The payment source type, titleized.
                            moto:
                              type: boolean
                              description: Indicates if the payment has been marked as MOTO (must be supported by the payment gateway).
                        shipping_address:
                          type: object
                          properties:
                            business:
                              type: boolean
                              description: Indicates if the address is a business or a personal one.
                            city:
                              type: string
                              description: The city specified in the address.
                            country_code:
                              type: string
                              description: The international 2-letter country code (as defined by the [ISO 3166-1](https://en.wikipedia.org/wiki/ISO_3166-1) standard) specified in the address.
                            geocoded:
                              type: boolean
                              description: Indicates if the address has been successfully geocoded.
                            localized:
                              type: boolean
                              description: Indicates if the latitude and longitude of the address are present, either geocoded or manually updated.
                            state_code:
                              type: string
                              description: The state, province or region code specified in the address.
                            zip_code:
                              type: string
                              description: The ZIP or postal code specified in the address.
                        tags:
                          type: object
                          properties:
                            id:
                              type: string
                              description: The tag ID.
                            name:
                              type: string
                              description: The tag name.
                        resource_errors:
                          type: object
                          properties:
                            code:
                              type: string
                              description: The resource errors code.
                            name:
                              type: string
                              description: The name of the resource error.
                            id:
                              type: string
                              description: The ID of the resource error.
                            message:
                              type: string
                              description: The resource error message.
                            created_at:
                              type: string
                              description: The date and time at which the resource error was created (complete date plus hours, minutes and seconds — according to the [ISO 8601](https://www.w3.org/TR/NOTE-datetime) standard).
                              format: '%Y-%m-%dT%H:%M:%SZ'
                              example: '2022-07-06T21:41:03Z'
                            updated_at:
                              type: string
                              description: The date and time at which the resource error was updated (complete date plus hours, minutes and seconds — according to the [ISO 8601](https://www.w3.org/TR/NOTE-datetime) standard).
                              format: '%Y-%m-%dT%H:%M:%SZ'
                              example: '2022-07-06T21:41:03Z'
                  meta:
                    type: object
                    properties:
                      type:
                        type: string
                        description: Action name
                      trace_id:
                        type: string
                        description: Request ID
