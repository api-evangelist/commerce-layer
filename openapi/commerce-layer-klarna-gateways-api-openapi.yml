openapi: 3.2.0
info:
  title: Commerce Layer Klarna Gateways API
  version: 7.10.1
  contact:
    name: API Support
    url: https://commercelayer.io
    email: support@commercelayer.io
  description: Headless Commerce for Global Brands.
servers:
- url: https://{your_organization_slug}.commercelayer.io/api
  description: API
- url: https://core.commercelayer.io/users/sign_in
  description: Sign in
- url: https://docs.commercelayer.io/api
  description: API reference
security:
- bearerAuth: []
tags:
- name: klarna_gateways
  description: resource type
paths:
  /klarna_gateways:
    get:
      operationId: GET/klarna_gateways
      summary: List all klarna gateways
      description: List all klarna gateways
      tags:
      - klarna_gateways
      responses:
        '200':
          description: A list of klarna gateway objects
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/klarnaGatewayResponseList'
    post:
      operationId: POST/klarna_gateways
      summary: Create a klarna gateway
      description: Create a klarna gateway
      tags:
      - klarna_gateways
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/klarnaGatewayCreate'
      responses:
        '201':
          description: The created klarna gateway object
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/klarnaGatewayResponse'
  /klarna_gateways/{klarnaGatewayId}:
    get:
      operationId: GET/klarna_gateways/klarnaGatewayId
      summary: Retrieve a klarna gateway
      description: Retrieve a klarna gateway
      tags:
      - klarna_gateways
      parameters:
      - name: klarnaGatewayId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      responses:
        '200':
          description: The klarna gateway object
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/klarnaGatewayResponse'
    patch:
      operationId: PATCH/klarna_gateways/klarnaGatewayId
      summary: Update a klarna gateway
      description: Update a klarna gateway
      tags:
      - klarna_gateways
      parameters:
      - name: klarnaGatewayId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/klarnaGatewayUpdate'
      responses:
        '200':
          description: The updated klarna gateway object
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/klarnaGatewayResponse'
    delete:
      operationId: DELETE/klarna_gateways/klarnaGatewayId
      summary: Delete a klarna gateway
      description: Delete a klarna gateway
      tags:
      - klarna_gateways
      parameters:
      - name: klarnaGatewayId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      responses:
        '204':
          description: No content
components:
  schemas:
    klarnaGatewayResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: string
              description: Unique identifier for the resource (hash).
              example: XAyRWNUzyN
            type:
              type: string
              description: The resource's type
              enum:
              - klarna_gateways
            links:
              type: object
              properties:
                self:
                  type: string
                  description: URL
            attributes:
              $ref: '#/components/schemas/klarnaGateway/properties/data/properties/attributes'
            relationships:
              type: object
              properties:
                payment_methods:
                  type: object
                  properties:
                    links:
                      type: object
                      properties:
                        self:
                          type: string
                          description: URL
                        related:
                          type: string
                          description: URL
                    data:
                      type: object
                      properties:
                        type:
                          type: string
                          description: The resource's type
                          enum:
                          - payment_methods
                        id:
                          type: string
                          description: The resource ID
                event_stores:
                  type: object
                  properties:
                    links:
                      type: object
                      properties:
                        self:
                          type: string
                          description: URL
                        related:
                          type: string
                          description: URL
                    data:
                      type: object
                      properties:
                        type:
                          type: string
                          description: The resource's type
                          enum:
                          - event_stores
                        id:
                          type: string
                          description: The resource ID
                klarna_payments:
                  type: object
