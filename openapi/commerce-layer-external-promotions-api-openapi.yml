openapi: 3.1.0
info:
  title: Commerce Layer addresses external_promotions API
  version: 7.10.1
  contact:
    name: API Support
    url: https://commercelayer.io
    email: support@commercelayer.io
  description: Headless Commerce for Global Brands.
servers:
- url: https://{your_organization_slug}.commercelayer.io/api
  description: API
- url: https://core.commercelayer.io/users/sign_in
  description: Sign in
- url: https://docs.commercelayer.io/api
  description: API reference
security:
- bearerAuth: []
tags:
- name: external_promotions
  description: resource type
paths:
  /external_promotions:
    get:
      operationId: GET/external_promotions
      summary: List all external promotions
      description: List all external promotions
      tags:
      - external_promotions
      responses:
        '200':
          description: A list of external promotion objects
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/externalPromotionResponseList'
    post:
      operationId: POST/external_promotions
      summary: Create an external promotion
      description: Create an external promotion
      tags:
      - external_promotions
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/externalPromotionCreate'
      responses:
        '201':
          description: The created external promotion object
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/externalPromotionResponse'
  /external_promotions/{externalPromotionId}:
    get:
      operationId: GET/external_promotions/externalPromotionId
      summary: Retrieve an external promotion
      description: Retrieve an external promotion
      tags:
      - external_promotions
      parameters:
      - name: externalPromotionId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      responses:
        '200':
          description: The external promotion object
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/externalPromotionResponse'
    patch:
      operationId: PATCH/external_promotions/externalPromotionId
      summary: Update an external promotion
      description: Update an external promotion
      tags:
      - external_promotions
      parameters:
      - name: externalPromotionId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/externalPromotionUpdate'
      responses:
        '200':
          description: The updated external promotion object
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/externalPromotionResponse'
    delete:
      operationId: DELETE/external_promotions/externalPromotionId
      summary: Delete an external promotion
      description: Delete an external promotion
      tags:
      - external_promotions
      parameters:
      - name: externalPromotionId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      responses:
        '204':
          description: No content
components:
  schemas:
    externalPromotionCreate:
      required:
      - data
      type: object
      properties:
        data:
          type: object
          required:
          - type
          - attributes
          properties:
            type:
              type: string
              description: The resource's type
              enum:
              - external_promotions
            attributes:
              type: object
              properties:
                name:
                  type: string
                  description: The promotion's internal name.
                  example: Personal promotion
                currency_code:
                  type: string
                  description: The international 3-letter currency code as defined by the ISO 4217 standard.
                  example: EUR
                exclusive:
                  type: boolean
                  description: Indicates if the promotion will be applied exclusively, based on its priority score.
                  example: true
                priority:
                  type: integer
                  description: The priority assigned to the promotion (lower means higher priority).
                  example: 2
                starts_at:
                  type: string
                  description: The activation date/time of this promotion.
                  example: '2018-01-01T12:00:00.000Z'
                expires_at:
                  type: string
                  description: The expiration date/time of this promotion (must be after starts_at).
                  example: '2018-01-02T12:00:00.000Z'
                total_usage_limit:
                  type: integer
                  description: The total number of times this promotion can be applied. When 'null' it means promotion can be applied infinite times.
                  example: 5
                _disable:
                  type: boolean
                  description: Send this attribute if you want to mark this resource as disabled.
                  example: true
                _enable:
                  type: boolean
                  description: Send this attribute if you want to mark this resource as enabled.
                  example: true
                reference:
                  type: string
                  description: A string that you can use to add any external identifier to the resource. This can be useful for integrating the resource to an external system, like an ERP, a marketing tool, a CRM, or whatever.
                  example: ANY-EXTERNAL-REFEFERNCE
                reference_origin:
                  type: string
                  description: Any identifier of the third party system that defines the reference code.
                  example: ANY-EXTERNAL-REFEFERNCE-ORIGIN
                metadata:
                  type: object
                  description: Set of key-value pairs that you can attach to the resource. This can be useful for storing additional information about the resource in a structured format.
                  example:
                    foo: bar
                external_includes:
                  type: array
                  description: List of related resources that will be included in the request to the external callback. Please do consult the documentation to check on which resource the includes are related (i.e. the order) and the defaults in case no list is provided.
                  example:
                  - order.line_item_options
                  items:
                    type: string
                promotion_url:
                  type: string
                  description: The URL to the service that will compute the discount.
                  example: https://external_promotion.yourbrand.com
              required:
              - name
              - starts_at
              - expires_at
              - promotion_url
            relationships:
              type: object
              properties:
                market:
                  required:
                  - data
                  type: object
                  properties:
                    data:
                      type: object
                      properties:
                        type:
                          type: string
                          description: The resource's type
                          enum:
                          - markets
                        id:
                          type: string
                          description: Unique identifier for the resource (hash).
                          example: XAyRWNUzyN
                order_amount_promotion_rule:
