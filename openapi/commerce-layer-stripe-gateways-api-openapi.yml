openapi: 3.1.0
info:
  title: Commerce Layer addresses stripe_gateways API
  version: 7.10.1
  contact:
    name: API Support
    url: https://commercelayer.io
    email: support@commercelayer.io
  description: Headless Commerce for Global Brands.
servers:
- url: https://{your_organization_slug}.commercelayer.io/api
  description: API
- url: https://core.commercelayer.io/users/sign_in
  description: Sign in
- url: https://docs.commercelayer.io/api
  description: API reference
security:
- bearerAuth: []
tags:
- name: stripe_gateways
  description: resource type
paths:
  /stripe_gateways:
    get:
      operationId: GET/stripe_gateways
      summary: List all stripe gateways
      description: List all stripe gateways
      tags:
      - stripe_gateways
      responses:
        '200':
          description: A list of stripe gateway objects
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/stripeGatewayResponseList'
    post:
      operationId: POST/stripe_gateways
      summary: Create a stripe gateway
      description: Create a stripe gateway
      tags:
      - stripe_gateways
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/stripeGatewayCreate'
      responses:
        '201':
          description: The created stripe gateway object
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/stripeGatewayResponse'
  /stripe_gateways/{stripeGatewayId}:
    get:
      operationId: GET/stripe_gateways/stripeGatewayId
      summary: Retrieve a stripe gateway
      description: Retrieve a stripe gateway
      tags:
      - stripe_gateways
      parameters:
      - name: stripeGatewayId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      responses:
        '200':
          description: The stripe gateway object
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/stripeGatewayResponse'
    patch:
      operationId: PATCH/stripe_gateways/stripeGatewayId
      summary: Update a stripe gateway
      description: Update a stripe gateway
      tags:
      - stripe_gateways
      parameters:
      - name: stripeGatewayId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/stripeGatewayUpdate'
      responses:
        '200':
          description: The updated stripe gateway object
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/stripeGatewayResponse'
    delete:
      operationId: DELETE/stripe_gateways/stripeGatewayId
      summary: Delete a stripe gateway
      description: Delete a stripe gateway
      tags:
      - stripe_gateways
      parameters:
      - name: stripeGatewayId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      responses:
        '204':
          description: No content
components:
  schemas:
    stripeGatewayCreate:
      required:
      - data
      type: object
      properties:
        data:
          type: object
          required:
          - type
          - attributes
          properties:
            type:
              type: string
              description: The resource's type
              enum:
              - stripe_gateways
            attributes:
              type: object
              properties:
                name:
                  type: string
                  description: The payment gateway's internal name.
                  example: US payment gateway
                force_payments:
                  type: boolean
                  example: false
                _disable:
                  type: boolean
                  description: Send this attribute if you want to mark this resource as disabled.
                  example: true
                _enable:
                  type: boolean
                  description: Send this attribute if you want to mark this resource as enabled.
                  example: true
                reference:
                  type: string
                  description: A string that you can use to add any external identifier to the resource. This can be useful for integrating the resource to an external system, like an ERP, a marketing tool, a CRM, or whatever.
                  example: ANY-EXTERNAL-REFEFERNCE
                reference_origin:
                  type: string
                  description: Any identifier of the third party system that defines the reference code.
                  example: ANY-EXTERNAL-REFEFERNCE-ORIGIN
                metadata:
                  type: object
                  description: Set of key-value pairs that you can attach to the resource. This can be useful for storing additional information about the resource in a structured format.
                  example:
                    foo: bar
                _check:
                  type: boolean
                  description: Send this attribute if you want to check the credentials against the payment gateway's APIs.
                  example: true
                login:
                  type: string
                  description: The gateway login.
                  example: sk_live_xxxx-yyyy-zzzz
                publishable_key:
                  type: string
                  description: The gateway publishable API key.
                  example: pk_live_xxxx-yyyy-zzzz
                connected_account:
                  type: string
                  description: The account (if any) for which the funds of the PaymentIntent are intended.
                  example: acct_xxxx-yyyy-zzzz
                auto_payments:
                  type: boolean
                  description: Indicates if the gateway will accept payment methods enabled in the Stripe dashboard.
                  example: true
              required:
              - name
              - login
            relationships:
              type: object
              properties: {}
    stripeGatewayUpdate:
      required:
      - data
      type: object
      properties:
        data:
          type: object
          required:
          - type
          - id
          - attributes
          properties:
            type:
              type: string
              description: The resource's type
              enum:
              - stripe_gateways
            id:
              type: string
              description: Unique identifier for the resource (hash).
              example: XAyRWNUzyN
            attributes:
              type: object
              properties:
                name:
                  type: string
                  description: The payment gateway's internal name.
                  example: US payment gateway
                  nullable: false
                force_payments:
                  type: boolean
                  example: false
                  nullable: false
                _disable:
                  type: boolean
                  description: Send this attribute if you want to mark this resource as disabled.
                  example: true
                  nullable: false
                _enable:
                  type: boolean
                  description: Send this attribute if you want to mark this resource as enabled.
                  example: true
                  nullable: false
                reference:
                  type: string
                  description: A string that you can use to add any external identifier to the resource. This can be useful for integrating the resource to an external system, like an ERP, a marketing tool, a CRM, or whatever.
                  example: ANY-EXTERNAL-REFEFERNCE
                  nullable: true
                reference_origin:
                  type: string
                  description: Any identifier of the third party system that defines the reference code.
                  example: ANY-EXTERNAL-REFEFERNCE-ORIGIN
                  nullable: true
                metadata:
                  type: object
                  description: Set of key-value pairs that you can attach to the resource. This can be useful for storing additional information about the resource in a structured format.
                  example:
                    foo: bar
                  nullable: true
                _check:
                  type: boolean
                  description: Send this attribute if you want to check the credentials against the payment gateway's APIs.
                  example: true
                  nullable: false
                connected_account:
                  type: string
                  description: The account (if any) for which the funds of the PaymentIntent are intended.
                  example: acct_xxxx-yyyy-zzzz
                  nullable: true
                auto_payments:
                  type: boolean
                  description: Indicates if the gateway will accept payment methods enabled in the Stripe dashboard.
                  example: true
                  nullable: false
            relationships:
              type: object
              properties: {}
    stripeGatewayResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: string
              description: Unique identifier for the resource (hash).
              example: XAyRWNUzyN
            type:
              type: string
              description: The resource's type
              enum:
              - stripe_gateways
            links:
              type: object
              properties:
                self:
                  type: string
                  description: URL
            attributes:
              $ref: '#/components/schemas/stripeGateway/properties/data/properties/attributes'
            relationships:
              type: object
              properties:
                payment_methods:
                  type: object
                  properties:
                    links:
                      type: object
                      properties:
                        self:
                          type: string
                          description: URL
                        related:
                          type: string
                          description: URL
                    data:
                      type: object
                      properties:
                        type:
                          type: string
                          description: The resource's type
                          enum:
                          - payment_methods
                        id:
                          type: string
                          description: The resource ID
                event_stores:
                  type: object
                  properties:
                    links:
                      type: object
                      properties:
                        self:
                          type: string
                          description: URL
                        related:
                          type: string
                          description: URL
                    data:
                      type: object
                      properties:
                        type:
                          type: string
                          description: The resource's type
                          enum:
                          - event_stores
                        id:
                          type: string
                          description: The resource ID
                stripe_payments:
                  type: object
                  properties:
                    links:
                      type: object
                      properties:
                        self:
                          type: string
                          description: URL
                        related:
                          type: string
                          description: URL
                    data:
                      type: object
                      properties:
                        type:
                          type: string
                          description: The resource's type
                          enum:
                          - stripe_payments
                        id:
                          type: string
                          description: The resource ID
    stripeGatewayResponseList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/stripeGatewayResponse/properties/data'
    stripeGateway:
      properties:
        data:
          properties:
            attributes:
              type: object
              properties:
                name:
                  type: string
                  description: The payment gateway's internal name.
                  example: US payment gateway
                  nullable: false
                force_payments:
                  type: boolean
                  example: false
                  nullable: true
                credential_keys:
                  type: object
                  description: The payment gateway's API credential keys last digits.
                  example:
                    api_key: '********BW989'
                  nullable: true
                disabled_at:
                  type: string
                  description: Time at which this resource was disabled.
                  example: '2018-01-01T12:00:00.000Z'
                  nullable: true
                created_at:
                  type: string
                  description: Time at which the resource was created.
                  example: '2018-01-01T12:00:00.000Z'
                  nullable: false
                updated_at:
                  type: string
                  description: Time at which the resource was last updated.
                  example: '2018-01-01T12:00:00.000Z'
                  nullable: false
                reference:
                  type: string
                  description: A string that you can use to add any external identifier to the resource. This can be useful for integrating the resource to an external system, like an ERP, a marketing tool, a CRM, or whatever.
                  example: ANY-EXTERNAL-REFEFERNCE
                  nullable: true
                reference_origin:
                  type: string
                  description: Any identifier of the third party system that defines the reference code.
                  example: ANY-EXTERNAL-REFEFERNCE-ORIGIN
                  nullable: true
                metadata:
                  type: object
                  description: Set of key-value pairs that you can attach to the resource. This can be useful for storing additional information about the resource in a structured format.
                  example:
                    foo: bar
                  nullable: true
                connected_account:
                  type: string
                  description: The account (if any) for which the funds of the PaymentIntent are intended.
                  example: acct_xxxx-yyyy-zzzz
                  nullable: true
                auto_payments:
                  type: boolean
                  description: Indicates if the gateway will accept payment methods enabled in the Stripe dashboard.
                  example: true
                  nullable: true
                webhook_endpoint_id:
                  type: string
                  description: The gateway webhook endpoint ID, generated automatically.
                  example: xxxx-yyyy-zzzz
                  nullable: true
                webhook_endpoint_secret:
                  type: string
                  description: The gateway webhook endpoint secret, generated automatically.
                  example: xxxx-yyyy-zzzz
                  nullable: true
                webhook_endpoint_url:
                  type: string
                  description: The gateway webhook URL, generated automatically.
                  example: https://core.commercelayer.co/webhook_callbacks/stripe_gateways/xxxxx
                  nullable: true
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
