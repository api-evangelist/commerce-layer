openapi: 3.2.0
info:
  title: Commerce Layer Avalara Accounts API
  version: 7.10.1
  contact:
    name: API Support
    url: https://commercelayer.io
    email: support@commercelayer.io
  description: Headless Commerce for Global Brands.
servers:
- url: https://{your_organization_slug}.commercelayer.io/api
  description: API
- url: https://core.commercelayer.io/users/sign_in
  description: Sign in
- url: https://docs.commercelayer.io/api
  description: API reference
security:
- bearerAuth: []
tags:
- name: avalara_accounts
  description: resource type
paths:
  /avalara_accounts:
    get:
      operationId: GET/avalara_accounts
      summary: List all avalara accounts
      description: List all avalara accounts
      tags:
      - avalara_accounts
      responses:
        '200':
          description: A list of avalara account objects
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/avalaraAccountResponseList'
    post:
      operationId: POST/avalara_accounts
      summary: Create an avalara account
      description: Create an avalara account
      tags:
      - avalara_accounts
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/avalaraAccountCreate'
      responses:
        '201':
          description: The created avalara account object
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/avalaraAccountResponse'
  /avalara_accounts/{avalaraAccountId}:
    get:
      operationId: GET/avalara_accounts/avalaraAccountId
      summary: Retrieve an avalara account
      description: Retrieve an avalara account
      tags:
      - avalara_accounts
      parameters:
      - name: avalaraAccountId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      responses:
        '200':
          description: The avalara account object
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/avalaraAccountResponse'
    patch:
      operationId: PATCH/avalara_accounts/avalaraAccountId
      summary: Update an avalara account
      description: Update an avalara account
      tags:
      - avalara_accounts
      parameters:
      - name: avalaraAccountId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/avalaraAccountUpdate'
      responses:
        '200':
          description: The updated avalara account object
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/avalaraAccountResponse'
    delete:
      operationId: DELETE/avalara_accounts/avalaraAccountId
      summary: Delete an avalara account
      description: Delete an avalara account
      tags:
      - avalara_accounts
      parameters:
      - name: avalaraAccountId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      responses:
        '204':
          description: No content
components:
  schemas:
    avalaraAccountResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: string
              description: Unique identifier for the resource (hash).
              example: XAyRWNUzyN
            type:
              type: string
              description: The resource's type
              enum:
              - avalara_accounts
            links:
              type: object
              properties:
                self:
                  type: string
                  description: URL
            attributes:
              $ref: '#/components/schemas/avalaraAccount/properties/data/properties/attributes'
            relationships:
              type: object
              properties:
                markets:
                  type: object
                  properties:
                    links:
                      type: object
                      properties:
                        self:
                          type: string
                          description: URL
                        related:
                          type: string
                          description: URL
                    data:
                      type: object
                      properties:
