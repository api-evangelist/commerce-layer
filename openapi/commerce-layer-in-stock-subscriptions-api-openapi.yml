      summary: Retrieve an in stock subscription
      description: Retrieve an in stock subscription
      tags:
      - in_stock_subscriptions
      parameters:
      - name: inStockSubscriptionId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      responses:
