                  type: integer
                  description: The options amount of the line item, in cents. Cannot be passed by sales channels.
                  example: 1000
                  nullable: true
                options_amount_float:
                  type: number
                  description: The options amount of the line item, float.
                  example: 10.0
                  nullable: true
                formatted_options_amount:
                  type: string
                  description: The options amount of the line item, formatted.
                  example: €10,00
                  nullable: true
                discount_cents:
                  type: integer
                  description: The discount applied to the line item, in cents. When you apply a discount to an order, this is automatically calculated basing on the line item total_amount_cents value.
                  example: -1000
                  nullable: true
                discount_float:
                  type: number
                  description: The discount applied to the line item, float. When you apply a discount to an order, this is automatically calculated basing on the line item total_amount_cents value.
                  example: 10.0
                  nullable: true
                formatted_discount:
                  type: string
                  description: The discount applied to the line item, fromatted. When you apply a discount to an order, this is automatically calculated basing on the line item total_amount_cents value.
                  example: €10,00
                  nullable: true
                total_amount_cents:
                  type: integer
                  description: Calculated as unit amount x quantity + options amount, in cents.
                  example: 18800
                  nullable: true
