openapi: 3.2.0
info:
  title: Commerce Layer Prices API
  version: 7.10.1
  contact:
    name: API Support
    url: https://commercelayer.io
    email: support@commercelayer.io
  description: Headless Commerce for Global Brands.
servers:
- url: https://{your_organization_slug}.commercelayer.io/api
  description: API
- url: https://core.commercelayer.io/users/sign_in
  description: Sign in
- url: https://docs.commercelayer.io/api
  description: API reference
security:
- bearerAuth: []
tags:
- name: prices
  description: resource type
paths:
  /prices:
    get:
      operationId: GET/prices
      summary: List all prices
      description: List all prices
      tags:
      - prices
      responses:
        '200':
          description: A list of price objects
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/priceResponseList'
    post:
      operationId: POST/prices
      summary: Create a price
      description: Create a price
      tags:
      - prices
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/priceCreate'
      responses:
        '201':
          description: The created price object
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/priceResponse'
  /prices/{priceId}:
    get:
      operationId: GET/prices/priceId
      summary: Retrieve a price
      description: Retrieve a price
      tags:
      - prices
      parameters:
      - name: priceId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      responses:
        '200':
          description: The price object
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/priceResponse'
    patch:
      operationId: PATCH/prices/priceId
      summary: Update a price
      description: Update a price
      tags:
      - prices
      parameters:
      - name: priceId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/priceUpdate'
      responses:
        '200':
          description: The updated price object
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/priceResponse'
    delete:
      operationId: DELETE/prices/priceId
      summary: Delete a price
      description: Delete a price
      tags:
      - prices
      parameters:
      - name: priceId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      responses:
        '204':
          description: No content
