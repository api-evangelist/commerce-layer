openapi: 3.1.0
info:
  title: Commerce Layer addresses promotion_rules API
  version: 7.10.1
  contact:
    name: API Support
    url: https://commercelayer.io
    email: support@commercelayer.io
  description: Headless Commerce for Global Brands.
servers:
- url: https://{your_organization_slug}.commercelayer.io/api
  description: API
- url: https://core.commercelayer.io/users/sign_in
  description: Sign in
- url: https://docs.commercelayer.io/api
  description: API reference
security:
- bearerAuth: []
tags:
- name: promotion_rules
  description: resource type
paths:
  /promotion_rules:
    get:
      operationId: GET/promotion_rules
      summary: List all promotion rules
      description: List all promotion rules
      tags:
      - promotion_rules
      responses:
        '200':
          description: A list of promotion rule objects
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/promotionRuleResponseList'
  /promotion_rules/{promotionRuleId}:
    get:
      operationId: GET/promotion_rules/promotionRuleId
      summary: Retrieve a promotion rule
      description: Retrieve a promotion rule
      tags:
      - promotion_rules
      parameters:
      - name: promotionRuleId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      responses:
        '200':
          description: The promotion rule object
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/promotionRuleResponse'
components:
  schemas:
    promotionRuleResponseList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/promotionRuleResponse/properties/data'
    promotionRule:
      properties:
        data:
          properties:
            attributes:
              type: object
              properties:
                type:
                  type: string
                  description: The promotion rule's type.
                  example: coupon_codes_promotion_rules
                  nullable: false
                  enum:
                  - order_amount_promotion_rules
                  - sku_list_promotion_rules
                  - coupon_codes_promotion_rules
                  - custom_promotion_rules
                created_at:
                  type: string
                  description: Time at which the resource was created.
                  example: '2018-01-01T12:00:00.000Z'
                  nullable: false
                updated_at:
                  type: string
                  description: Time at which the resource was last updated.
                  example: '2018-01-01T12:00:00.000Z'
                  nullable: false
                reference:
                  type: string
                  description: A string that you can use to add any external identifier to the resource. This can be useful for integrating the resource to an external system, like an ERP, a marketing tool, a CRM, or whatever.
                  example: ANY-EXTERNAL-REFEFERNCE
                  nullable: true
                reference_origin:
                  type: string
                  description: Any identifier of the third party system that defines the reference code.
                  example: ANY-EXTERNAL-REFEFERNCE-ORIGIN
                  nullable: true
                metadata:
                  type: object
                  description: Set of key-value pairs that you can attach to the resource. This can be useful for storing additional information about the resource in a structured format.
                  example:
                    foo: bar
                  nullable: true
    promotionRuleResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: string
              description: Unique identifier for the resource (hash).
              example: XAyRWNUzyN
            type:
              type: string
              description: The resource's type
              enum:
              - promotion_rules
            links:
              type: object
              properties:
                self:
                  type: string
                  description: URL
            attributes:
              $ref: '#/components/schemas/promotionRule/properties/data/properties/attributes'
            relationships:
              type: object
              properties:
                promotion:
                  type: object
                  properties:
                    links:
                      type: object
                      properties:
                        self:
                          type: string
                          description: URL
                        related:
                          type: string
                          description: URL
                    data:
                      type: object
                      properties:
                        type:
                          type: string
                          description: The resource's type
                          enum:
                          - promotion
                        id:
                          type: string
                          description: The resource ID
                event_stores:
                  type: object
                  properties:
                    links:
                      type: object
                      properties:
                        self:
                          type: string
                          description: URL
                        related:
                          type: string
                          description: URL
                    data:
                      type: object
                      properties:
                        type:
                          type: string
                          description: The resource's type
                          enum:
                          - event_stores
                        id:
                          type: string
                          description: The resource ID
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
