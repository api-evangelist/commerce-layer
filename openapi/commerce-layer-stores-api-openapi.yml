openapi: 3.2.0
info:
  title: Commerce Layer Stores API
  version: 7.10.1
  contact:
    name: API Support
    url: https://commercelayer.io
    email: support@commercelayer.io
  description: Headless Commerce for Global Brands.
servers:
- url: https://{your_organization_slug}.commercelayer.io/api
  description: API
- url: https://core.commercelayer.io/users/sign_in
  description: Sign in
- url: https://docs.commercelayer.io/api
  description: API reference
security:
- bearerAuth: []
tags:
- name: stores
  description: resource type
paths:
  /stores:
    get:
      operationId: GET/stores
      summary: List all stores
      description: List all stores
      tags:
      - stores
      responses:
        '200':
          description: A list of store objects
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/storeResponseList'
    post:
      operationId: POST/stores
      summary: Create a store
      description: Create a store
      tags:
      - stores
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/storeCreate'
      responses:
        '201':
          description: The created store object
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/storeResponse'
  /stores/{storeId}:
    get:
      operationId: GET/stores/storeId
      summary: Retrieve a store
      description: Retrieve a store
      tags:
      - stores
      parameters:
      - name: storeId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      responses:
        '200':
          description: The store object
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/storeResponse'
    patch:
      operationId: PATCH/stores/storeId
      summary: Update a store
      description: Update a store
      tags:
      - stores
      parameters:
      - name: storeId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/storeUpdate'
      responses:
        '200':
          description: The updated store object
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/storeResponse'
    delete:
      operationId: DELETE/stores/storeId
      summary: Delete a store
      description: Delete a store
      tags:
      - stores
      parameters:
      - name: storeId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      responses:
        '204':
          description: No content
