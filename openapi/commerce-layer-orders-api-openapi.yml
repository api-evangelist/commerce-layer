components:
  schemas:
    klarnaPayment:
      type: object
      properties:
        data:
          type: object
          required:
          - type
          - attributes
          properties:
            type:
              type: string
              description: The resource's type
              enum:
              - klarna_payments
            attributes:
              type: object
              properties:
                session_id:
                  type: string
                  description: The identifier of the payment session.
                  example: xxxx-yyyy-zzzz
                  nullable: true
                client_token:
                  type: string
                  description: The public token linked to your API credential. Available upon session creation.
                  example: xxxx-yyyy-zzzz
                  nullable: true
                payment_methods:
                  type: array
                  description: The merchant available payment methods for the assoiated order. Available upon session creation.
                  example:
                  - foo: bar
                  nullable: false
                  items:
                    type: object
                auth_token:
                  type: string
                  description: The token returned by a successful client authorization, mandatory to place the order.
                  example: xxxx-yyyy-zzzz
                  nullable: true
                mismatched_amounts:
                  type: boolean
                  description: Indicates if the order current amount differs form the one of the created payment intent.
                  example: false
                  nullable: true
                payment_instrument:
                  type: object
                  description: Information about the payment instrument used in the transaction.
                  example:
                    issuer: cl bank
                    card_type: visa
                  nullable: true
                created_at:
                  type: string
                  description: Time at which the resource was created.
                  example: '2018-01-01T12:00:00.000Z'
                  nullable: false
                updated_at:
                  type: string
                  description: Time at which the resource was last updated.
                  example: '2018-01-01T12:00:00.000Z'
                  nullable: false
                reference:
                  type: string
                  description: A string that you can use to add any external identifier to the resource. This can be useful for integrating the resource to an external system, like an ERP, a marketing tool, a CRM, or whatever.
                  example: ANY-EXTERNAL-REFEFERNCE
                  nullable: true
                reference_origin:
                  type: string
                  description: Any identifier of the third party system that defines the reference code.
                  example: ANY-EXTERNAL-REFEFERNCE-ORIGIN
                  nullable: true
                metadata:
                  type: object
                  description: Set of key-value pairs that you can attach to the resource. This can be useful for storing additional information about the resource in a structured format.
                  example:
                    foo: bar
                  nullable: true
            relationships:
              type: object
              properties:
                order:
                  type: object
                  properties:
                    data:
                      type: object
                      properties:
                        type:
                          type: string
                          description: The resource's type
                          enum:
                          - orders
                        id:
                          type: string
                          description: Unique identifier for the resource (hash).
                          example: XAyRWNUzyN
                payment_gateway:
                  type: object
                  properties:
                    data:
                      type: object
                      properties:
                        type:
                          type: string
                          description: The resource's type
                          enum:
                          - payment_gateways
                        id:
                          type: string
                          description: Unique identifier for the resource (hash).
                          example: XAyRWNUzyN
                event_stores:
                  type: object
                  properties:
                    data:
                      type: object
                      properties:
                        type:
                          type: string
                          description: The resource's type
                          enum:
                          - event_stores
                        id:
                          type: string
                          description: Unique identifier for the resource (hash).
                          example: XAyRWNUzyN
    orderUpdate:
      required:
      - data
      type: object
      properties:
        data:
          type: object
          required:
          - type
          - id
          - attributes
          properties:
            type:
              type: string
              description: The resource's type
              enum:
              - orders
            id:
              type: string
              description: Unique identifier for the resource (hash).
              example: XAyRWNUzyN
            attributes:
              type: object
              properties:
                number:
                  type: string
                  description: The order identifier. Can be specified if unique within the organization (for enterprise plans only), default to numeric ID otherwise. Cannot be passed by sales channels.
                  example: '1234'
                  nullable: true
                affiliate_code:
                  type: string
                  description: The affiliate code, if any, to track commissions using any third party services.
                  example: xxxx-yyyy-zzzz
                  nullable: true
                autorefresh:
                  type: boolean
                  description: Save this attribute as 'false' if you want prevent the order to be refreshed automatically at each change (much faster).
                  example: true
                  nullable: false
                place_async:
                  type: boolean
                  description: Save this attribute as 'true' if you want perform the place asynchronously. Payment errors, if any, will be collected afterwards.
                  example: true
                  nullable: false
                guest:
                  type: boolean
                  description: Indicates if the order has been placed as guest.
                  example: true
                  nullable: false
                customer_email:
                  type: string
                  description: The email address of the associated customer. When creating or updating an order, this is a shortcut to find or create the associated customer by email.
                  example: john@example.com
                  nullable: true
                customer_password:
                  type: string
                  description: The password of the associated customer. When creating or updating an order, this is a shortcut to sign up the associated customer.
                  example: secret
                language_code:
                  type: string
                  description: The preferred language code (ISO 639-1) to be used when communicating with the customer. This can be useful when sending the order to 3rd party marketing tools and CRMs. If the language is supported, the hosted checkout will be localized accordingly.
                  example: it
                  nullable: true
                freight_taxable:
                  type: boolean
                  description: Indicates if taxes are applied to shipping costs.
                  example: true
                  nullable: false
                payment_method_taxable:
                  type: boolean
                  description: Indicates if taxes are applied to payment methods costs.
                  example: true
                  nullable: false
                adjustment_taxable:
                  type: boolean
                  description: Indicates if taxes are applied to positive adjustments.
                  example: true
                  nullable: false
                gift_card_taxable:
                  type: boolean
                  description: Indicates if taxes are applied to purchased gift cards.
                  example: false
                  nullable: false
                shipping_country_code_lock:
                  type: string
                  description: The country code that you want the shipping address to be locked to. This can be useful to make sure the shipping address belongs to a given shipping country, e.g. the one selected in a country selector page. Not relevant if order contains only digital products.
                  example: IT
                  nullable: true
                coupon_code:
                  type: string
                  description: The coupon code to be used for the order. If valid, it triggers a promotion adding a discount line item to the order.
                  example: SUMMERDISCOUNT
                  nullable: true
                gift_card_code:
                  type: string
                  description: The gift card code (at least the first 8 characters) to be used for the order. If valid, it uses the gift card balance to pay for the order.
                  example: cc92c23e-967e-48b2-a323-59add603301f
                  nullable: true
                cart_url:
                  type: string
                  description: The cart url on your site. If present, it will be used on our hosted checkout application.
                  example: https://yourdomain.com/cart
                  nullable: true
                return_url:
                  type: string
                  description: The return url on your site. If present, it will be used on our hosted checkout application.
                  example: https://yourdomain.com/
                  nullable: true
                terms_url:
                  type: string
                  description: The terms and conditions url on your site. If present, it will be used on our hosted checkout application.
                  example: https://yourdomain.com/terms
                  nullable: true
                privacy_url:
                  type: string
                  description: The privacy policy url on your site. If present, it will be used on our hosted checkout application.
                  example: https://yourdomain.com/privacy
                  nullable: true
                _archive:
                  type: boolean
                  description: Send this attribute if you want to archive the order.
                  example: true
                  nullable: false
                _unarchive:
                  type: boolean
                  description: Send this attribute if you want to unarchive the order.
                  example: true
                  nullable: false
                _pending:
                  type: boolean
                  description: Send this attribute if you want to move a draft or placing order to pending. Cannot be passed by sales channels.
                  example: true
                  nullable: false
                _place:
                  type: boolean
                  description: Send this attribute if you want to place the order.
                  example: true
                  nullable: false
                _cancel:
                  type: boolean
                  description: Send this attribute if you want to cancel a placed order. The order's authorization will be automatically voided.
                  example: true
                  nullable: false
                _approve:
                  type: boolean
                  description: Send this attribute if you want to approve a placed order. Cannot be passed by sales channels.
                  example: true
                  nullable: false
                _approve_and_capture:
                  type: boolean
                  description: Send this attribute if you want to approve and capture a placed order. Cannot be passed by sales channels.
                  example: true
                  nullable: false
                _authorize:
                  type: boolean
                  description: Send this attribute if you want to authorize the order's payment source.
                  example: true
                  nullable: false
                _authorization_amount_cents:
                  type: integer
                  description: Send this attribute as a value in cents if you want to overwrite the amount to be authorized.
                  example: 500
                _capture:
                  type: boolean
                  description: Send this attribute if you want to capture an authorized order. Cannot be passed by sales channels.
                  example: true
                  nullable: false
                _refund:
                  type: boolean
                  description: Send this attribute if you want to refund a captured order. Cannot be passed by sales channels.
                  example: true
                  nullable: false
                _fulfill:
                  type: boolean
                  description: Send this attribute if you want to mark as fulfilled the order (shipments must be cancelled, shipped or delivered, alternatively order must be approved). Cannot be passed by sales channels.
                  example: true
                  nullable: false
                _update_taxes:
                  type: boolean
                  description: Send this attribute if you want to force tax calculation for this order (a tax calculator must be associated to the order's market).
                  example: true
                  nullable: false
                _nullify_payment_source:
                  type: boolean
                  description: Send this attribute if you want to nullify the payment source for this order.
                  example: false
                  nullable: false
                _fix_payment_source:
                  type: boolean
                  description: Send this attribute if you want to set the payment source associated with the last succeeded authorization. At the end of the fix the order should be placed and authorized and ready to be approved. A tentative to fix the payment source is done before approval automatically. Cannot be passed by sales channels.
                  example: true
                  nullable: false
                _billing_address_clone_id:
                  type: string
                  description: The id of the address that you want to clone to create the order's billing address.
                  example: '1234'
                _shipping_address_clone_id:
                  type: string
                  description: The id of the address that you want to clone to create the order's shipping address.
                  example: '1234'
                _customer_payment_source_id:
                  type: string
                  description: The id of the customer payment source (i.e. credit card) that you want to use as the order's payment source.
                  example: '1234'
                _shipping_address_same_as_billing:
                  type: boolean
                  description: Send this attribute if you want the shipping address to be cloned from the order's billing address.
                  example: true
                  nullable: false
                _billing_address_same_as_shipping:
                  type: boolean
                  description: Send this attribute if you want the billing address to be cloned from the order's shipping address.
                  example: true
                  nullable: false
                _commit_invoice:
                  type: boolean
                  description: Send this attribute if you want commit the sales tax invoice to the associated tax calculator (currently supported by Avalara).
                  example: true
                  nullable: false
                _refund_invoice:
                  type: boolean
                  description: Send this attribute if you want refund the sales tax invoice to the associated tax calculator (currently supported by Avalara).
                  example: true
                  nullable: false
                _save_payment_source_to_customer_wallet:
                  type: boolean
                  description: Send this attribute if you want the order's payment source to be saved in the customer's wallet as a customer payment source.
                  example: true
                  nullable: false
                _save_shipping_address_to_customer_address_book:
                  type: boolean
                  description: Send this attribute if you want the order's shipping address to be saved in the customer's address book as a customer address.
                  example: true
                  nullable: false
                _save_billing_address_to_customer_address_book:
                  type: boolean
                  description: Send this attribute if you want the order's billing address to be saved in the customer's address book as a customer address.
                  example: true
                  nullable: false
                _refresh:
                  type: boolean
                  description: Send this attribute if you want to manually refresh the order.
                  example: true
                  nullable: false
                _refresh_prices:
                  type: boolean
                  description: Send this attribute if you want to refresh the prices of the line items associated to this order. Cannot be passed by sales channels.
                  example: true
                  nullable: false
                _validate:
                  type: boolean
                  description: Send this attribute if you want to trigger the external validation for the order.
                  example: true
                  nullable: false
                _create_subscriptions:
                  type: boolean
                  description: Send this attribute upon/after placing the order if you want to create order subscriptions from the line items that have a frequency.
                  example: true
                  nullable: false
                _start_editing:
                  type: boolean
                  description: Send this attribute if you want to edit the order after it is placed. Remember you cannot exceed the original total amount. Cannot be passed by sales channels.
                  example: true
                  nullable: false
                _stop_editing:
                  type: boolean
                  description: Send this attribute to stop the editing for the order and return back to placed status. Cannot be passed by sales channels.
                  example: true
                  nullable: false
                expires_at:
                  type: string
                  description: The expiration date/time of this order. Cannot be passed by sales channels.
                  example: '2018-01-02T12:00:00.000Z'
                  nullable: true
                expiration_info:
                  type: object
                  description: The information related to the order expiration, in case expires_at is not null. Cannot be passed by sales channels.
                  example:
                    summary_message: Your tickets are reserved for the remaining time.
                    expired_message: Your session has expired. Please start your checkout again.
                    redirect_url: https://yourshop.com/
                  nullable: true
                _reset_circuit:
                  type: boolean
                  description: Send this attribute if you want to reset the circuit breaker associated to this resource to 'closed' state and zero failures count. Cannot be passed by sales channels.
                  example: true
                  nullable: false
                _add_tags:
                  type: string
                  description: Comma separated list of tags to be added. Duplicates, invalid and non existing ones are discarded. Cannot be passed by sales channels.
                _remove_tags:
                  type: string
                  description: Comma separated list of tags to be removed. Duplicates, invalid and non existing ones are discarded. Cannot be passed by sales channels.
                reference:
                  type: string
                  description: A string that you can use to add any external identifier to the resource. This can be useful for integrating the resource to an external system, like an ERP, a marketing tool, a CRM, or whatever.
                  example: ANY-EXTERNAL-REFEFERNCE
                  nullable: true
                reference_origin:
                  type: string
                  description: Any identifier of the third party system that defines the reference code.
                  example: ANY-EXTERNAL-REFEFERNCE-ORIGIN
                  nullable: true
                metadata:
                  type: object
                  description: Set of key-value pairs that you can attach to the resource. This can be useful for storing additional information about the resource in a structured format.
                  example:
                    foo: bar
                  nullable: true
