  /orders/date_breakdown:
    post:
      operationId: POST/orders/date_breakdown
      summary: Query date_breakdown on orders
      description: "Date breakdowns summarizes metrics data grouped by time intervals on a defined time range. They also support support breakdowns over the main date breakdown query and also supports all breakdown queries capabilities through the \"breakdown\" key, this also includes the possibility of nesting the breakdown over the main breakdown. \n\n\nSingle date breakdown request (no breakdown)\n\n`{\n\t\"date_breakdown\": {\n            \"by\": \"shipments.cancelled_at\",\n            \"field\": \"order.id\",\n            \"interval\": \"month\",\n            \"operator\": \"value_count\"\n        }\n}`\n  \n  \nSingle date breakdown request with one breakdown\n \n` \n{\n\t\"date_breakdown\": {\n            \"by\": \"shipments.cancelled_at\",\n            \"field\": \"order.id\",\n            \"interval\": \"month\",\n            \"operator\": \"value_count\",\n            \"breakdown\": {\n                \"by\": \"order.currency_code\",\n                \"field\": \"order.total_amount_with_taxes\",\n                \"operator\": \"sum\",\n                \"sort\": \"desc\",\n                \"limit\": 5\n            }\n        }\n  }`\n  \n  \nSingle date breakdown request with breakdown with a nested breakdown\n\n` \n{\n\"date_breakdown\": {\n        \"by\": \"order.placed_at\",\n        \"field\": \"order.total_amount_with_taxes\",\n        \"operator\": \"stats\",\n        \"interval\": \"month\",\n        \"breakdown\": {\n            \"by\": \"order.country_code\",\n            \"field\": \"line_items.total_amount\",\n            \"operator\": \"sum\",\n            \"sort\": \"desc\",\n            \"limit\": 20,\n            \"breakdown\": {\n                \"by\": \"order.currency_code\",\n                \"field\": \"line_items.total_amount\",\n                \"operator\": \"sum\",\n                \"sort\": \"desc\",\n                \"limit\": 21\n            }\n        }\n    }\n }`\n  "
      tags:
      - orders
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/orders_date_breakdown_request'
      responses:
        '200':
          description: The date_breakdown result from orders
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: '%Y-%m-%dT%H:%M:%SZ'
                          example: '2022-07-06T21:41:03Z'
                        value:
                          oneOf:
                          - type: number
                            example: 8
                          - type: string
                          - type: object
                            properties:
                              count:
                                type: number
                                example: 8
                              min:
                                type: number
                                example: 8
                              max:
                                type: number
                                example: 8
                              avg:
                                type: number
                                example: 8
                              sum:
                                type: number
                                example: 8
                      additionalProperties:
                        type: array
                        items:
                          type: object
                          properties:
                            label:
                              type: string
                            value:
                              oneOf:
                              - type: number
                                example: 8
                              - type: string
                              - type: object
                                properties:
                                  count:
                                    type: number
                                    example: 8
                                  min:
                                    type: number
                                    example: 8
                                  max:
                                    type: number
                                    example: 8
                                  avg:
                                    type: number
                                    example: 8
                                  sum:
                                    type: number
                                    example: 8
                  meta:
                    type: object
                    properties:
                      type:
                        type: string
                        description: Action name
