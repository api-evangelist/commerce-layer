                              example: '2022-07-06T21:41:03Z'
                            ready_to_ship_at:
                              type: string
                              description: The date and time at which the shipment was ready to ship (complete date plus hours, minutes and seconds — according to the [ISO 8601](https://www.w3.org/TR/NOTE-datetime) standard).
                              format: '%Y-%m-%dT%H:%M:%SZ'
                              example: '2022-07-06T21:41:03Z'
                            shipped_at:
                              type: string
                              description: The date and time at which the shipment was shipped (complete date plus hours, minutes and seconds — according to the [ISO 8601](https://www.w3.org/TR/NOTE-datetime) standard).
                              format: '%Y-%m-%dT%H:%M:%SZ'
                              example: '2022-07-06T21:41:03Z'
                            created_at:
                              type: string
                              description: The date and time at which the shipment was created (complete date plus hours, minutes and seconds — according to the [ISO 8601](https://www.w3.org/TR/NOTE-datetime) standard).
