      description: API reference
  /orders/search:
    post:
      operationId: POST/orders/search
      summary: Query search on orders
      description: Get search results from orders
      tags:
      - orders
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/orders_search_request'
      responses:
        '200':
          description: The search result from orders
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        date_from:
                          type: string
                          description: The lower limit of the date and time range used to filter the collected orders (complete date plus hours, minutes and seconds — according to the [ISO 8601](https://www.w3.org/TR/NOTE-datetime) standard).
                          format: '%Y-%m-%dT%H:%M:%SZ'
                          example: '2022-07-06T21:41:03Z'
                        date_to:
                          type: string
                          description: The upper limit of the date and time range used to filter the collected orders (complete date plus hours, minutes and seconds — according to the [ISO 8601](https://www.w3.org/TR/NOTE-datetime) standard).
                          format: '%Y-%m-%dT%H:%M:%SZ'
                          example: '2022-07-06T21:41:03Z'
                        date_field:
                          type: string
                          description: The date field (e.g. `created_at`, `updated_at`, etc.) where to apply the date and time range filter.
                          enum:
                          - current_date
                          - approved_at
                          - cancelled_at
                          - created_at
                          - placed_at
                          - archived_at
                          - updated_at
                          - fulfillment_updated_at
                          - payment_updated_at
                          default: current_date
                        discounted:
                          type: boolean
                          description: Indicates a discount has been applied to the order.
                        refunded:
                          type: boolean
                          description: Indicates if the order has been partially or totally refunded.
                        gift_card:
                          type: boolean
                          description: Indicates if a gift card has been (or is set to be) used to pay — in total or in part - for the order.
                        coupon:
                          type: boolean
                          description: Indicates if a coupon code has been (or is set to be) used to pay — in total or in part — for the order.
                        customer_types:
                          type: string
                          description: The type of the associated customer. One of `new` or `returning`.
                        returned:
                          type: boolean
                          description: Indicates if a return is associated with the order.
                        options:
                          type: boolean
                          description: Indicates if at least one line item of the order has at least an option.
                        adjustment_amount:
                          type: number
                          description: The sum of all the adjustments applied to the order (float).
                          example: 121
                        adjustment_tax_amount:
                          type: number
                          description: The taxes applied to the order's adjustments (float).
                          example: 121
                        adjustment_taxable_amount:
                          type: number
                          description: The order's adjustment taxable amount (float).
                          example: 121
                        approved_at:
                          type: string
                          description: The date and time at which the order was approved (complete date plus hours, minutes and seconds — according to the [ISO 8601](https://www.w3.org/TR/NOTE-datetime) standard).
                          format: '%Y-%m-%dT%H:%M:%SZ'
                          example: '2022-07-06T21:41:03Z'
                        archived_at:
                          type: string
                          description: The date and time at which the order was archived (complete date plus hours, minutes and seconds — according to the [ISO 8601](https://www.w3.org/TR/NOTE-datetime) standard).
                          format: '%Y-%m-%dT%H:%M:%SZ'
                          example: '2022-07-06T21:41:03Z'
                        archived:
                          type: boolean
                          description: Indicates if the order has been archived.
                        cancelled_at:
                          type: string
                          description: The date and time at which the order was cancelled (complete date plus hours, minutes and seconds — according to the [ISO 8601](https://www.w3.org/TR/NOTE-datetime) standard).
                          format: '%Y-%m-%dT%H:%M:%SZ'
                          example: '2022-07-06T21:41:03Z'
                        country_codes:
                          type: string
                          description: The international 2-letter country code (as defined by the [ISO 3166-1](https://en.wikipedia.org/wiki/ISO_3166-1) standard), automatically inherited from the order's shipping address.
                        coupon_codes:
                          type: string
                          description: The coupon code to be used to pay — in total or in part — for the order. If valid, it triggers a promotion adding a discount line item to the order.
                        created_at:
                          type: string
                          description: The date and time at which the order was created (complete date plus hours, minutes and seconds — according to the [ISO 8601](https://www.w3.org/TR/NOTE-datetime) standard).
                          format: '%Y-%m-%dT%H:%M:%SZ'
                          example: '2022-07-06T21:41:03Z'
                        currency_codes:
                          type: string
                          description: The international 3-letter currency code (as defined by the [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) standard), automatically inherited from the order's market.
                        discount_amount:
                          type: number
                          description: The sum of all the discounts applied to the order (float).
                          example: 121
                        duty_amount:
                          type: number
                          description: The duty amount that is calculated by external services (float).
                          example: 121
                        freight_taxable:
                          type: boolean
                          description: Indicates if taxes are applied to shipping costs.
                        fulfillment_statuses:
                          type: string
                          description: The order's fulfillment status. One of `unfulfilled` (default), `in_progress`, or `fulfilled`.
                        fulfillment_updated_at:
                          type: string
                          description: The date and time at which the order's fulfillment status was last updated (complete date plus hours, minutes and seconds — according to the [ISO 8601](https://www.w3.org/TR/NOTE-datetime) standard).
                          format: '%Y-%m-%dT%H:%M:%SZ'
                          example: '2022-07-06T21:41:03Z'
                        gift_card_codes:
                          type: string
                          description: The gift card code (at least the first 8 characters) to be used to pay — in total or in part — for the order. If valid, it uses the associated gift card balance.
                        gift_card_amount:
                          type: number
                          description: The sum of all the gift cards applied to the order (float).
                          example: 121
                        guest:
                          type: boolean
                          description: Indicates if the order has been placed as guest (by a non-logged in customer).
                        ids:
                          type: string
                          description: The ID of the order.
                        language_codes:
                          type: string
                          description: The preferred language code (as defined by the [ISO 639-1](https://en.wikipedia.org/wiki/List_of_ISO_639-1_codes) standard) to be used when communicating with the customer when checking out the order.
                        line_item_options_count:
                          type: integer
                          description: The total number of line item options associated with the order's line items.
                          example: 8
                        mode:
                          type: string
                          description: The order's environment (can be one of `test` or `live`).
                          enum:
                          - live
                          - test
                        numbers:
                          type: integer
                          description: The numeric unique identifier for the order.
                          example: 8
                        payment_method_amount:
                          type: number
                          description: The costs of the payment method associated with the order (float).
                          example: 121
                        payment_method_tax_amount:
                          type: number
                          description: The taxes applied to the order's payment method costs (float).
                          example: 121
                        payment_method_taxable_amount:
                          type: number
                          description: The order's payment method taxable amount (float).
                          example: 121
                        payment_statuses:
                          type: string
                          description: The order's payment status. One of `unpaid` (default), `authorized`, `partially_authorized`, `paid`, `partially_paid`, `voided`, `partially_voided`, `refunded`, `partially_refunded` or `free`.
                        payment_updated_at:
                          type: string
                          description: The date and time at which the order's payment status was last updated (complete date plus hours, minutes and seconds — according to the [ISO 8601](https://www.w3.org/TR/NOTE-datetime) standard).
                          format: '%Y-%m-%dT%H:%M:%SZ'
                          example: '2022-07-06T21:41:03Z'
                        placed_at:
                          type: string
                          description: The date and time at which the order was placed (complete date plus hours, minutes and seconds — according to the [ISO 8601](https://www.w3.org/TR/NOTE-datetime) standard).
                          format: '%Y-%m-%dT%H:%M:%SZ'
                          example: '2022-07-06T21:41:03Z'
                        references:
                          type: string
                          description: Any external identifier that might be useful to link the order resource to other systems through the Commerce Layer core API.
                        reference_origins:
                          type: string
                          description: Any identifier of the 3rd-party system that defines the reference code.
                        shipments_count:
                          type: integer
                          description: The total number of shipments associated with the order.
                          example: 8
                        shipping_amount:
                          type: number
                          description: The sum of all the shipping costs of the order (float).
                          example: 121
                        shipping_taxable_amount:
                          type: number
                          description: The order's shipping taxable amount (float).
                          example: 121
                        skus_count:
                          type: integer
                          description: The total number of SKUs in the order's line items.
                          example: 8
                        statuses:
                          type: string
                          description: The order status. One of `placed`, `approved`, or `cancelled`.
                        subtotal_amount:
                          type: number
                          description: The sum of all the SKU line items total amounts (float).
                          example: 121
                        subtotal_tax_amount:
                          type: number
                          description: The taxes applied to the order's subtotal (float).
                          example: 121
                        subtotal_taxable_amount:
                          type: number
                          description: The order's subtotal taxable amount (float).
                          example: 121
                        tax_included:
                          type: boolean
                          description: Indicates if taxes are included in the order amounts (automatically inherited from the order's price list).
                        total_amount:
                          type: number
                          description: The order's total amount (float).
                          example: 121
                        total_amount_with_taxes:
                          type: number
                          description: The order's total amount, taxes included (float).
                          example: 121
                        total_tax_amount:
                          type: number
                          description: The sum of all the taxes applied to the order (float).
                          example: 121
                        total_taxable_amount:
                          type: number
                          description: The order's total taxable amount (float).
                          example: 121
                        updated_at:
                          type: string
                          description: The date and time at which the order was last updated (complete date plus hours, minutes and seconds — according to the [ISO 8601](https://www.w3.org/TR/NOTE-datetime) standard).
                          format: '%Y-%m-%dT%H:%M:%SZ'
                          example: '2022-07-06T21:41:03Z'
                        current_date:
                          type: string
                          description: The date and time of the order's latest status change, regardless of the order's status (complete date plus hours, minutes and seconds — according to the [ISO 8601](https://www.w3.org/TR/NOTE-datetime) standard).
                          format: '%Y-%m-%dT%H:%M:%SZ'
                          example: '2022-07-06T21:41:03Z'
                        seconds_in_draft:
                          type: integer
                          description: The difference in seconds between `placed_at` and `created_at` (`null` if the order hasn't been placed yet).
                          example: 8
                        seconds_in_approved:
                          type: integer
                          description: The difference in seconds between `cancelled_at` and `approved_at` (`null` if the order hasn't been approved yet or no further status change happened after approval — e.g. the order has been regularly fulfilled).
                          example: 8
                        seconds_in_placed:
                          type: integer
                          description: The difference in seconds between `approved_at` and `placed_at` if the order has been approved or between `cancelled_at` and `placed_at` if the order has been cancelled before approval (`null` if the order hasn't been placed yet or no further status change happened after placement).
                          example: 8
                        placed_day_of_week:
                          type: integer
                          description: The day of week when the order was placed, expressed as an integer (`0` through `6`, from Sunday to Saturday — e.g. `1` is Monday).
                          example: 8
                        refunds_total_amount_with_taxes:
                          type: integer
                          description: Total amount of refunds (including taxes) associated with the order.
                          example: 8
                        total_amount_with_taxes_net_of_refunds:
                          type: number
                          description: The total amount of the order minus the total amount of refunds.
                          example: 121
                        aggregated_details:
                          type: string
                          description: Searchable field containing all orders data.
                        link_ids:
                          type: string
                          description: The link ID used during the checkout.
                        user_ids:
                          type: string
                          description: The user ID used to generate the link.
                        store_ids:
                          type: string
                          description: The store ID used during the checkout.
                        affiliate_codes:
                          type: string
                          description: The affiliate code used during the checkout.
                        billing_address:
                          type: object
                          properties:
                            business:
                              type: boolean
                              description: Indicates if the address is a business or a personal one.
                            city:
                              type: string
                              description: The city specified in the address.
                            country_code:
                              type: string
                              description: The international 2-letter country code (as defined by the [ISO 3166-1](https://en.wikipedia.org/wiki/ISO_3166-1) standard) specified in the address.
                            geocoded:
                              type: boolean
                              description: Indicates if the address has been successfully geocoded.
                            localized:
                              type: boolean
                              description: Indicates if the latitude and longitude of the address are present, either geocoded or manually updated.
                            state_code:
                              type: string
                              description: The state, province or region code specified in the address.
                            zip_code:
                              type: string
                              description: The ZIP or postal code specified in the address.
                            company:
                              type: string
                              description: The company specified in the address.
                            first_name:
                              type: string
                              description: The first name specified in the address.
                            last_name:
                              type: string
                              description: The last name specified in the address.
                        customer:
                          type: object
                          properties:
                            id:
                              type: string
                              description: The ID of the customer.
                            email:
                              type: string
                              description: The email address of the customer.
                            group_name:
                              type: string
                              description: The name of the customer group the customer belongs to (if any).
                            reference:
                              type: string
                              description: Any external identifier that might be useful to link the customer resource to other systems through the Commerce Layer core API.
                            reference_origin:
                              type: string
                              description: Any identifier of the 3rd-party system that defines the reference code.
                        line_items:
                          type: object
                          properties:
                            code:
                              type: string
                              description: The code of the associated SKU or bundle.
                            discount:
                              type: number
                              description: The discount applied to the line item (float).
                              example: 121
                            id:
                              type: string
                              description: The ID of the line item.
                            item_id:
                              type: string
                              description: The ID of the associated item.
                            item_type:
                              type: string
                              description: The type of the associated item. One of `sku`, `bundle`, `shipment`, `payment_method`, `adjustment`, `gift_card`, or a valid promotion type (e.g. `percentage_discount_promotion`, `free_shipping_promotion`, etc.).
                            name:
                              type: string
                              description: The name of the line item. When missing, it gets populated with the name of the associated item (if present).
                            options_amount:
                              type: number
                              description: The amount of the line item option (float).
                              example: 121
                            quantity:
                              type: integer
                              description: The line item's quantity.
                              example: 8
                            tax_amount:
                              type: number
                              description: The collected tax amount for the line item (float). Otherwise calculated as the line item's `(total_amount - discount) * tax_rate` (float).
                              example: 121
                            tax_rate:
                              type: number
                              description: The tax rate for the line item (if calculated).
                              example: 121
                            total_amount:
                              type: number
                              description: The total amount of the line item (float). Calculated as the line item's `unit_amount * quantity` + plus the associated line item options amount.
                              example: 121
                            unit_amount:
                              type: number
                              description: The unit amount of the line item (float).
                              example: 121
                            updated_at:
                              type: string
                              description: The date and time at which the line item was last updated (complete date plus hours, minutes and seconds — according to the [ISO 8601](https://www.w3.org/TR/NOTE-datetime) standard).
                              format: '%Y-%m-%dT%H:%M:%SZ'
                              example: '2022-07-06T21:41:03Z'
                        line_items.options:
                          type: object
                          properties:
                            id:
                              type: string
                              description: The ID of the line item option.
                            name:
                              type: string
                              description: The name of the line item option. When missing, it gets populated with the name of the associated SKU option.
                            quantity:
                              type: integer
                              description: The line item option's quantity.
                              example: 8
                            total_amount:
                              type: number
                              description: The total amount of the line item option (float). Calculated as the line item option's `unit_amount * quantity`.
                              example: 121
                            unit_amount:
                              type: number
                              description: The unit amount of the line item option (float).
                              example: 121
                        market:
                          type: object
                          properties:
                            id:
                              type: string
                              description: The ID of the market.
                            name:
                              type: string
                              description: The name of the market.
                            number:
                              type: integer
                              description: The numeric unique identifier for the market.
                              example: 8
                        organization:
                          type: object
                          properties:
                            id:
                              type: string
                              description: The ID of the organization.
                            name:
                              type: string
                              description: The name of the organization.
                            slug:
                              type: string
                              description: The name of the organization, parsed and converted into a URL-friendly slug.
                        payment_method:
                          type: object
                          properties:
                            id:
                              type: string
                              description: The ID of the payment method.
                            source_type:
                              type: string
                              description: The payment source type. One of `AdyenPayment`, `BraintreePayment`, `CheckoutComPayment`, `CreditCard`, `ExternalPayment`, `KlarnaPayment`, `PaypalPayment`, `StripePayment`, or `WireTransfer`.
                            name:
                              type: string
                              description: The payment source type, titleized.
                            moto:
                              type: boolean
                              description: Indicates if the payment has been marked as MOTO (must be supported by the payment gateway).
                            issuer:
                              type: string
                              description: The payment method's issuer (if present and provided by the payment gateway).
                            issuer_type:
                              type: string
                              description: The type of issuer (if present and provided by the payment gateway).
                            card_type:
                              type: string
                              description: The type of card used to pay for the order (if present and provided by the payment gateway).
                        refunds:
                          type: object
                          properties:
                            id:
                              type: string
                              description: The ID of the refund.
                            amount:
                              type: number
                              description: The refunded amount (float).
                              example: 121
                            number:
                              type: string
                              description: The transaction number associated with the refund (auto-generated).
                        shipping_address:
                          type: object
                          properties:
                            business:
                              type: boolean
                              description: Indicates if the address is a business or a personal one.
                            city:
                              type: string
                              description: The city specified in the address.
                            country_code:
                              type: string
                              description: The international 2-letter country code (as defined by the [ISO 3166-1](https://en.wikipedia.org/wiki/ISO_3166-1) standard) specified in the address.
                            geocoded:
                              type: boolean
                              description: Indicates if the address has been successfully geocoded.
                            localized:
                              type: boolean
                              description: Indicates if the latitude and longitude of the address are present, either geocoded or manually updated.
                            state_code:
                              type: string
                              description: The state, province or region code specified in the address.
                            zip_code:
                              type: string
                              description: The ZIP or postal code specified in the address.
                        shipments:
                          type: object
                          properties:
                            id:
                              type: string
                              description: The shipment ID.
                            number:
                              type: string
                              description: The shipment number.
                            items_count:
                              type: integer
                              description: The shipment items count.
                              example: 8
                            cost_amount:
                              type: integer
                              description: The shipment cost amount.
                              example: 8
                            status:
                              type: string
                              description: The shipment status.
                            cancelled_at:
                              type: string
                              description: The date and time at which the shipment status was cancelled (complete date plus hours, minutes and seconds — according to the [ISO 8601](https://www.w3.org/TR/NOTE-datetime) standard).
                              format: '%Y-%m-%dT%H:%M:%SZ'
                              example: '2022-07-06T21:41:03Z'
                            delivered_at:
                              type: string
                              description: The date and time at which the shipment was delivered (complete date plus hours, minutes and seconds — according to the [ISO 8601](https://www.w3.org/TR/NOTE-datetime) standard).
                              format: '%Y-%m-%dT%H:%M:%SZ'
                              example: '2022-07-06T21:41:03Z'
                            on_hold_at:
                              type: string
                              description: The date and time at which the shipment status was put on hold (complete date plus hours, minutes and seconds — according to the [ISO 8601](https://www.w3.org/TR/NOTE-datetime) standard).
                              format: '%Y-%m-%dT%H:%M:%SZ'
                              example: '2022-07-06T21:41:03Z'
                            picking_at:
                              type: string
                              description: The date and time at which the shipment was picked (complete date plus hours, minutes and seconds — according to the [ISO 8601](https://www.w3.org/TR/NOTE-datetime) standard).
                              format: '%Y-%m-%dT%H:%M:%SZ'
                              example: '2022-07-06T21:41:03Z'
                            packing_at:
