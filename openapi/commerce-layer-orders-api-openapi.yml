openapi: 3.2.0
info:
  title: Commerce Layer Orders API
  contact:
    name: API Support
    url: https://commercelayer.io
    email: support@commercelayer.io
  version: '1.0'
  description: 'Operations tagged orders across 2 of this provider''s published API definitions: commerce-layer-core-api-openapi.json, commerce-layer-metrics-api-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{your_organization_slug}.commercelayer.io/api
  description: API
- url: https://core.commercelayer.io/users/sign_in
  description: Sign in
- url: https://docs.commercelayer.io/api
  description: API reference
- url: https://{your-domain}.commercelayer.io/metrics
  description: Commerce Layer Metrics API
- url: https://docs.commercelayer.io/metrics-api
  description: API reference
security:
- bearerAuth: []
tags:
- name: orders
  description: resource type
paths:
  /orders:
    get:
      operationId: GET/orders
      summary: List all orders
      description: List all orders
      tags:
      - orders
      responses:
        '200':
          description: A list of order objects
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/orderResponseList'
    post:
      operationId: POST/orders
      summary: Create an order
      description: Create an order
      tags:
      - orders
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/orderCreate'
      responses:
        '201':
          description: The created order object
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/orderResponse'
    servers:
    - url: https://{your_organization_slug}.commercelayer.io/api
      description: API
    - url: https://core.commercelayer.io/users/sign_in
      description: Sign in
    - url: https://docs.commercelayer.io/api
      description: API reference
  /orders/{orderId}:
    get:
      operationId: GET/orders/orderId
      summary: Retrieve an order
      description: Retrieve an order
      tags:
      - orders
      parameters:
      - name: orderId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      responses:
        '200':
          description: The order object
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/orderResponse'
    patch:
      operationId: PATCH/orders/orderId
      summary: Update an order
      description: Update an order
      tags:
      - orders
      parameters:
      - name: orderId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/orderUpdate'
      responses:
        '200':
          description: The updated order object
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/orderResponse'
    delete:
      operationId: DELETE/orders/orderId
      summary: Delete an order
      description: Delete an order
      tags:
      - orders
      parameters:
      - name: orderId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      responses:
        '204':
          description: No content
    servers:
    - url: https://{your_organization_slug}.commercelayer.io/api
      description: API
    - url: https://core.commercelayer.io/users/sign_in
      description: Sign in
    - url: https://docs.commercelayer.io/api
