                              example: '2022-07-06T21:41:03Z'
                            updated_at:
                              type: string
                              description: The date and time at which the shipment was updated (complete date plus hours, minutes and seconds — according to the [ISO 8601](https://www.w3.org/TR/NOTE-datetime) standard).
                              format: '%Y-%m-%dT%H:%M:%SZ'
                              example: '2022-07-06T21:41:03Z'
                            reference:
                              type: string
                              description: Any external identifier that might be useful to link the shipment resource to other systems through the Commerce Layer core API.
                            reference_origin:
                              type: string
                              description: Any identifier of the 3rd-party system that defines the reference code.
                            seconds_in_picking:
                              type: integer
                              description: The difference in seconds between `picking_at` and `packing_at` (`null` if the order hasn't been picked yet).
                              example: 8
