                      properties:
                        type:
                          type: string
                          description: The resource's type.
                          enum:
                          - versions
                        id:
                          type: string
                          description: The ID of the resource.
                          example: XGZwpOSrWL
    roleResponseList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/roleResponse/properties/data'
    roleCreate:
      required:
      - data
      type: object
      properties:
        data:
          type: object
          required:
          - type
          - attributes
          properties:
            type:
              type: string
              description: The resource's type.
              enum:
              - roles
            attributes:
              type: object
              properties:
                name:
                  type: string
                  description: The role name.
