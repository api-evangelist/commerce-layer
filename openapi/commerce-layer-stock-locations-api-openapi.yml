                  example: europe1
                label_format:
                  type: string
                  description: The shipping label format for this stock location. Can be one of 'PDF', 'ZPL', 'EPL2', or 'PNG'.
                  example: PDF
                suppress_etd:
                  type: boolean
                  description: Flag it if you want to skip the electronic invoice creation when generating the customs info for this stock location shipments.
