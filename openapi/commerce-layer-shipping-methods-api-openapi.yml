openapi: 3.1.0
info:
  title: Commerce Layer addresses shipping_methods API
  version: 7.10.1
  contact:
    name: API Support
    url: https://commercelayer.io
    email: support@commercelayer.io
  description: Headless Commerce for Global Brands.
servers:
- url: https://{your_organization_slug}.commercelayer.io/api
  description: API
- url: https://core.commercelayer.io/users/sign_in
  description: Sign in
- url: https://docs.commercelayer.io/api
  description: API reference
security:
- bearerAuth: []
tags:
- name: shipping_methods
  description: resource type
paths:
  /delivery_lead_times/{deliveryLeadTimeId}/shipping_method:
    get:
      operationId: GET/deliveryLeadTimeId/shipping_method
      summary: Retrieve the shipping method associated to the delivery lead time
      description: Retrieve the shipping method associated to the delivery lead time
      tags:
      - shipping_methods
      parameters:
      - name: deliveryLeadTimeId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      responses:
        '200':
          description: The shipping_method associated to the delivery lead time
  /markets/{marketId}/default_shipping_method:
    get:
      operationId: GET/marketId/default_shipping_method
      summary: Retrieve the default shipping method associated to the market
      description: Retrieve the default shipping method associated to the market
      tags:
      - shipping_methods
      parameters:
      - name: marketId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      responses:
        '200':
          description: The default_shipping_method associated to the market
  /orders/{orderId}/default_shipping_method:
    get:
      operationId: GET/orderId/default_shipping_method
      summary: Retrieve the default shipping method associated to the order
      description: Retrieve the default shipping method associated to the order
      tags:
      - shipping_methods
      parameters:
      - name: orderId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      responses:
        '200':
          description: The default_shipping_method associated to the order
  /shipments/{shipmentId}/shipping_method:
    get:
      operationId: GET/shipmentId/shipping_method
      summary: Retrieve the shipping method associated to the shipment
      description: Retrieve the shipping method associated to the shipment
      tags:
      - shipping_methods
      parameters:
      - name: shipmentId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      responses:
        '200':
          description: The shipping_method associated to the shipment
  /shipments/{shipmentId}/available_shipping_methods:
    get:
      operationId: GET/shipmentId/available_shipping_methods
      summary: Retrieve the available shipping methods associated to the shipment
      description: Retrieve the available shipping methods associated to the shipment
      tags:
      - shipping_methods
      parameters:
      - name: shipmentId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      responses:
        '200':
          description: The available_shipping_methods associated to the shipment
  /shipping_method_tiers/{shippingMethodTierId}/shipping_method:
    get:
      operationId: GET/shippingMethodTierId/shipping_method
      summary: Retrieve the shipping method associated to the shipping method tier
      description: Retrieve the shipping method associated to the shipping method tier
      tags:
      - shipping_methods
      parameters:
      - name: shippingMethodTierId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      responses:
        '200':
          description: The shipping_method associated to the shipping method tier
  /shipping_methods:
    get:
      operationId: GET/shipping_methods
      summary: List all shipping methods
      description: List all shipping methods
      tags:
      - shipping_methods
      responses:
        '200':
          description: A list of shipping method objects
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/shippingMethodResponseList'
    post:
      operationId: POST/shipping_methods
      summary: Create a shipping method
      description: Create a shipping method
      tags:
      - shipping_methods
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/shippingMethodCreate'
      responses:
        '201':
          description: The created shipping method object
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/shippingMethodResponse'
  /shipping_methods/{shippingMethodId}:
    get:
      operationId: GET/shipping_methods/shippingMethodId
      summary: Retrieve a shipping method
      description: Retrieve a shipping method
      tags:
      - shipping_methods
      parameters:
      - name: shippingMethodId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      responses:
        '200':
          description: The shipping method object
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/shippingMethodResponse'
    patch:
      operationId: PATCH/shipping_methods/shippingMethodId
      summary: Update a shipping method
      description: Update a shipping method
      tags:
      - shipping_methods
      parameters:
      - name: shippingMethodId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/shippingMethodUpdate'
      responses:
        '200':
          description: The updated shipping method object
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/shippingMethodResponse'
    delete:
      operationId: DELETE/shipping_methods/shippingMethodId
      summary: Delete a shipping method
      description: Delete a shipping method
      tags:
      - shipping_methods
      parameters:
      - name: shippingMethodId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      responses:
        '204':
          description: No content
  /shipping_weight_tiers/{shippingWeightTierId}/shipping_method:
    get:
      operationId: GET/shippingWeightTierId/shipping_method
      summary: Retrieve the shipping method associated to the shipping weight tier
      description: Retrieve the shipping method associated to the shipping weight tier
      tags:
