                  example: flat
                  enum:
                  - flat
                  - weight_tiered
                  - external
                currency_code:
                  type: string
                  description: The international 3-letter currency code as defined by the ISO 4217 standard.
                  example: EUR
                external_prices_url:
                  type: string
                  description: The URL used to overwrite prices by an external source.
                  example: https://external_prices.yourbrand.com
                price_amount_cents:
                  type: integer
                  description: The price of this shipping method, in cents.
                  example: 1000
                free_over_amount_cents:
                  type: integer
                  description: Apply free shipping if the order amount is over this value, in cents.
                  example: 9900
                use_subtotal:
                  type: boolean
                  description: Send this attribute if you want to compare the free over amount with order's subtotal (excluding discounts, if any).
                  example: true
                min_weight:
                  type: number
                  description: The minimum weight for which this shipping method is available.
                  example: 3.0
                max_weight:
                  type: number
                  description: The maximum weight for which this shipping method is available.
                  example: 300.0
                unit_of_weight:
                  type: string
                  description: The unit of weight. One of 'gr', 'oz', or 'lb'.
                  example: gr
                  enum:
                  - gr
                  - oz
                  - lb
                tax_code:
                  type: string
                  description: The freight tax identifier code, specific for a particular tax calculator.
                  example: FR010000
                _disable:
                  type: boolean
                  description: Send this attribute if you want to mark this resource as disabled.
                  example: true
                _enable:
                  type: boolean
                  description: Send this attribute if you want to mark this resource as enabled.
                  example: true
                external_includes:
                  type: array
                  description: List of related resources that will be included in the request to the external callback. Please do consult the documentation to check on which resource the includes are related (i.e. the order) and the defaults in case no list is provided.
