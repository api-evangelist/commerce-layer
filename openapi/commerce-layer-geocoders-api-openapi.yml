openapi: 3.1.0
info:
  title: Commerce Layer addresses geocoders API
  version: 7.10.1
  contact:
    name: API Support
    url: https://commercelayer.io
    email: support@commercelayer.io
  description: Headless Commerce for Global Brands.
servers:
- url: https://{your_organization_slug}.commercelayer.io/api
  description: API
- url: https://core.commercelayer.io/users/sign_in
  description: Sign in
- url: https://docs.commercelayer.io/api
  description: API reference
security:
- bearerAuth: []
tags:
- name: geocoders
  description: resource type
paths:
  /addresses/{addressId}/geocoder:
    get:
      operationId: GET/addressId/geocoder
      summary: Retrieve the geocoder associated to the address
      description: Retrieve the geocoder associated to the address
      tags:
      - geocoders
      parameters:
      - name: addressId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      responses:
        '200':
          description: The geocoder associated to the address
  /geocoders:
    get:
      operationId: GET/geocoders
      summary: List all geocoders
      description: List all geocoders
      tags:
      - geocoders
      responses:
        '200':
          description: A list of geocoder objects
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/geocoderResponseList'
  /geocoders/{geocoderId}:
    get:
      operationId: GET/geocoders/geocoderId
      summary: Retrieve a geocoder
      description: Retrieve a geocoder
      tags:
      - geocoders
      parameters:
      - name: geocoderId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      responses:
        '200':
          description: The geocoder object
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/geocoderResponse'
  /markets/{marketId}/geocoder:
    get:
      operationId: GET/marketId/geocoder
      summary: Retrieve the geocoder associated to the market
      description: Retrieve the geocoder associated to the market
      tags:
      - geocoders
      parameters:
      - name: marketId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      responses:
        '200':
          description: The geocoder associated to the market
components:
  schemas:
    geocoder:
      properties:
        data:
          properties:
            attributes:
              type: object
              properties:
                name:
                  type: string
                  description: The geocoder's internal name.
                  example: Default geocoder
                  nullable: false
                type:
                  type: string
                  description: The geocoder's type.
                  example: google_geocoders
                  nullable: false
                  enum:
                  - google_geocoders
                  - bing_geocoders
                created_at:
                  type: string
                  description: Time at which the resource was created.
                  example: '2018-01-01T12:00:00.000Z'
                  nullable: false
                updated_at:
                  type: string
                  description: Time at which the resource was last updated.
                  example: '2018-01-01T12:00:00.000Z'
                  nullable: false
                reference:
                  type: string
                  description: A string that you can use to add any external identifier to the resource. This can be useful for integrating the resource to an external system, like an ERP, a marketing tool, a CRM, or whatever.
                  example: ANY-EXTERNAL-REFEFERNCE
                  nullable: true
                reference_origin:
                  type: string
                  description: Any identifier of the third party system that defines the reference code.
                  example: ANY-EXTERNAL-REFEFERNCE-ORIGIN
                  nullable: true
                metadata:
                  type: object
                  description: Set of key-value pairs that you can attach to the resource. This can be useful for storing additional information about the resource in a structured format.
                  example:
                    foo: bar
                  nullable: true
    geocoderResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: string
              description: Unique identifier for the resource (hash).
              example: XAyRWNUzyN
            type:
              type: string
              description: The resource's type
              enum:
              - geocoders
            links:
              type: object
              properties:
                self:
                  type: string
                  description: URL
            attributes:
              $ref: '#/components/schemas/geocoder/properties/data/properties/attributes'
            relationships:
              type: object
              properties:
                markets:
                  type: object
                  properties:
                    links:
                      type: object
                      properties:
                        self:
                          type: string
                          description: URL
                        related:
                          type: string
                          description: URL
                    data:
                      type: object
                      properties:
                        type:
                          type: string
                          description: The resource's type
                          enum:
                          - markets
                        id:
                          type: string
                          description: The resource ID
                addresses:
                  type: object
                  properties:
                    links:
                      type: object
                      properties:
                        self:
                          type: string
                          description: URL
                        related:
                          type: string
                          description: URL
                    data:
                      type: object
                      properties:
                        type:
                          type: string
                          description: The resource's type
                          enum:
                          - addresses
                        id:
                          type: string
                          description: The resource ID
                attachments:
                  type: object
                  properties:
                    links:
                      type: object
                      properties:
                        self:
                          type: string
                          description: URL
                        related:
                          type: string
                          description: URL
                    data:
                      type: object
                      properties:
                        type:
                          type: string
                          description: The resource's type
                          enum:
                          - attachments
                        id:
                          type: string
                          description: The resource ID
                event_stores:
                  type: object
                  properties:
                    links:
                      type: object
                      properties:
                        self:
                          type: string
                          description: URL
                        related:
                          type: string
                          description: URL
                    data:
                      type: object
                      properties:
                        type:
                          type: string
                          description: The resource's type
                          enum:
                          - event_stores
                        id:
                          type: string
                          description: The resource ID
    geocoderResponseList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/geocoderResponse/properties/data'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
