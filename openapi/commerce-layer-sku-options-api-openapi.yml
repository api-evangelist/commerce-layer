                  example: €10,00
                  nullable: true
                delay_hours:
                  type: integer
                  description: The delay time (in hours) that should be added to the delivery lead time when this option is purchased.
                  example: 48
                  nullable: true
                delay_days:
                  type: integer
                  description: The delay time, in days (rounded).
                  example: 2
                  nullable: true
                sku_code_regex:
                  type: string
                  description: The regex that will be evaluated to match the SKU codes, max size is 5000.
                  example: ^(A|B).*$
                  nullable: true
                created_at:
                  type: string
                  description: Time at which the resource was created.
                  example: '2018-01-01T12:00:00.000Z'
                  nullable: false
                updated_at:
                  type: string
