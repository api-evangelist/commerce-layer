openapi: 3.2.0
info:
  title: Commerce Layer Sku Options API
  version: 7.10.1
  contact:
    name: API Support
    url: https://commercelayer.io
    email: support@commercelayer.io
  description: Headless Commerce for Global Brands.
servers:
- url: https://{your_organization_slug}.commercelayer.io/api
  description: API
- url: https://core.commercelayer.io/users/sign_in
  description: Sign in
- url: https://docs.commercelayer.io/api
  description: API reference
security:
- bearerAuth: []
tags:
- name: sku_options
  description: resource type
paths:
  /sku_options:
    get:
      operationId: GET/sku_options
      summary: List all SKU options
      description: List all SKU options
      tags:
      - sku_options
      responses:
        '200':
          description: A list of SKU option objects
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/skuOptionResponseList'
    post:
      operationId: POST/sku_options
      summary: Create a SKU option
      description: Create a SKU option
      tags:
      - sku_options
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/skuOptionCreate'
      responses:
        '201':
          description: The created SKU option object
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/skuOptionResponse'
  /sku_options/{skuOptionId}:
    get:
      operationId: GET/sku_options/skuOptionId
      summary: Retrieve a SKU option
      description: Retrieve a SKU option
      tags:
      - sku_options
      parameters:
      - name: skuOptionId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      responses:
        '200':
          description: The SKU option object
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/skuOptionResponse'
    patch:
      operationId: PATCH/sku_options/skuOptionId
      summary: Update a SKU option
      description: Update a SKU option
      tags:
      - sku_options
      parameters:
      - name: skuOptionId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/skuOptionUpdate'
      responses:
        '200':
          description: The updated SKU option object
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/skuOptionResponse'
    delete:
      operationId: DELETE/sku_options/skuOptionId
      summary: Delete a SKU option
      description: Delete a SKU option
      tags:
      - sku_options
      parameters:
      - name: skuOptionId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      responses:
        '204':
          description: No content
