      description: "Date breakdowns summarizes metrics data grouped by time intervals on a defined time range. They also support support breakdowns over the main date breakdown query and also supports all breakdown queries capabilities through the \"breakdown\" key, this also includes the possibility of nesting the breakdown over the main breakdown. \n\n\nSingle date breakdown request (no breakdown)\n\n`{\n\t\"date_breakdown\": {\n        \"by\": \"return.created_at\",\n        \"field\": \"return_line_items.line_item_total_amount\",\n        \"operator\": \"stats\",\n        \"interval\": \"month\"\n    }\n}`\n  \n  \nSingle date breakdown request with one breakdown\n \n` \n{\n\t\"date_breakdown\": {\n        \"by\": \"return.created_at\",\n        \"field\": \"return_line_items.line_item_total_amount\",\n        \"operator\": \"stats\",\n        \"interval\": \"month\",\n        \"breakdown\": {\n            \"by\": \"return.reference\",\n            \"field\": \"return_line_items.line_item_total_amount\",\n            \"operator\": \"sum\",\n            \"sort\": \"desc\",\n            \"limit\": 20\n        }\n    }\n  }`\n  \n  \nSingle date breakdown request with breakdown with a nested breakdown\n\n` \n\"date_breakdown\": {\n        \"by\": \"return.created_at\",\n        \"field\": \"return_line_items.line_item_total_amount\",\n        \"operator\": \"stats\",\n        \"interval\": \"month\",\n        \"breakdown\": {\n            \"by\": \"return.reference\",\n            \"field\": \"return_line_items.line_item_total_amount\",\n            \"operator\": \"sum\",\n            \"sort\": \"desc\",\n            \"limit\": 20,\n            \"breakdown\": {\n                \"by\": \"return.status\",\n                \"field\": \"return_line_items.line_item_total_amount\",\n                \"operator\": \"sum\",\n                \"sort\": \"desc\",\n                \"limit\": 21\n            }\n        }\n    }\n }`\n  "
      tags:
      - returns
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/returns_date_breakdown_request'
      responses:
        '200':
          description: The date_breakdown result from returns
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: '%Y-%m-%dT%H:%M:%SZ'
                          example: '2022-07-06T21:41:03Z'
                        value:
                          oneOf:
                          - type: number
                            example: 8
                          - type: string
                          - type: object
                            properties:
                              count:
                                type: number
                                example: 8
                              min:
                                type: number
                                example: 8
                              max:
                                type: number
                                example: 8
                              avg:
                                type: number
                                example: 8
                              sum:
                                type: number
                                example: 8
                      additionalProperties:
                        type: array
                        items:
                          type: object
                          properties:
                            label:
                              type: string
                            value:
                              oneOf:
                              - type: number
                                example: 8
                              - type: string
                              - type: object
                                properties:
                                  count:
                                    type: number
                                    example: 8
                                  min:
                                    type: number
                                    example: 8
                                  max:
                                    type: number
                                    example: 8
                                  avg:
                                    type: number
                                    example: 8
                                  sum:
                                    type: number
                                    example: 8
                  meta:
                    type: object
                    properties:
                      type:
                        type: string
                        description: Action name
                      trace_id:
