                  type: string
                  description: The frequency which generates a subscription. Must be supported by existing associated subscription_model.
                  example: monthly
                  nullable: true
                coupon_code:
                  type: string
                  description: The coupon code, if any, used to trigger this promotion line item. null for other line item types or if the promotion line item wasn't triggered by a coupon.
                  example: SUMMERDISCOUNT
                  nullable: true
                rule_outcomes:
                  type: object
                  description: The rule outcomes.
                  example: []
                  nullable: true
                circuit_state:
                  type: string
                  description: The circuit breaker state, by default it is 'closed'. It can become 'open' once the number of consecutive failures overlaps the specified threshold, in such case no further calls to the failing callback are made.
                  example: closed
                  nullable: true
