    lineItem:
      type: object
      properties:
        data:
          type: object
          required:
          - type
          - attributes
          properties:
            type:
              type: string
              description: The resource's type
              enum:
              - line_items
            attributes:
              type: object
              properties:
                sku_code:
                  type: string
                  description: The code of the associated SKU.
                  example: TSHIRTMM000000FFFFFFXLXX
                  nullable: true
                bundle_code:
                  type: string
                  description: The code of the associated bundle.
                  example: BUNDLEMM000000FFFFFFXLXX
                  nullable: true
                quantity:
                  type: integer
                  description: The line item quantity.
                  example: 4
                  nullable: false
                _external_price:
                  type: boolean
                  description: When creating or updating a new line item, set this attribute to '1' if you want to inject the unit_amount_cents price from an external source. Any successive price computation will be done externally, until the attribute is reset to '0'.
                  example: true
                  nullable: true
                currency_code:
                  type: string
                  description: The international 3-letter currency code as defined by the ISO 4217 standard, automatically inherited from the order's market.
                  example: EUR
                  nullable: true
                unit_amount_cents:
                  type: integer
                  description: The unit amount of the line item, in cents. Can be specified only via an integration application, or when the item is missing, otherwise is automatically computed by using one of the available methods. Cannot be passed by sales channels.
                  example: 10000
                  nullable: true
                unit_amount_float:
                  type: number
                  description: The unit amount of the line item, float. This can be useful to track the purchase on thrid party systems, e.g Google Analyitcs Enhanced Ecommerce.
                  example: 100.0
                  nullable: true
                formatted_unit_amount:
                  type: string
                  description: The unit amount of the line item, formatted. This can be useful to display the amount with currency in you views.
                  example: €100,00
                  nullable: true
                compare_at_amount_cents:
                  type: integer
                  description: The compared price amount, in cents. Useful to display a percentage discount.
                  example: 13000
                  nullable: true
                compare_at_amount_float:
                  type: number
                  description: The compared price amount, float.
                  example: 130.0
                  nullable: true
                formatted_compare_at_amount:
                  type: string
                  description: The compared price amount, formatted.
                  example: €130,00
                  nullable: true
                options_amount_cents:
                  type: integer
                  description: The options amount of the line item, in cents. Cannot be passed by sales channels.
                  example: 1000
                  nullable: true
                options_amount_float:
                  type: number
                  description: The options amount of the line item, float.
                  example: 10.0
                  nullable: true
                formatted_options_amount:
                  type: string
                  description: The options amount of the line item, formatted.
                  example: €10,00
                  nullable: true
                discount_cents:
                  type: integer
                  description: The discount applied to the line item, in cents. When you apply a discount to an order, this is automatically calculated basing on the line item total_amount_cents value.
                  example: -1000
                  nullable: true
                discount_float:
                  type: number
                  description: The discount applied to the line item, float. When you apply a discount to an order, this is automatically calculated basing on the line item total_amount_cents value.
                  example: 10.0
                  nullable: true
                formatted_discount:
                  type: string
                  description: The discount applied to the line item, fromatted. When you apply a discount to an order, this is automatically calculated basing on the line item total_amount_cents value.
                  example: €10,00
                  nullable: true
                total_amount_cents:
                  type: integer
                  description: Calculated as unit amount x quantity + options amount, in cents.
                  example: 18800
                  nullable: true
                total_amount_float:
                  type: number
                  description: Calculated as unit amount x quantity + options amount, float. This can be useful to track the purchase on thrid party systems, e.g Google Analyitcs Enhanced Ecommerce.
                  example: 188.0
                  nullable: false
                formatted_total_amount:
                  type: string
                  description: Calculated as unit amount x quantity + options amount, formatted. This can be useful to display the amount with currency in you views.
                  example: €188,00
                  nullable: true
                tax_amount_cents:
                  type: integer
                  description: The collected tax amount, otherwise calculated as total amount cents - discount cent * tax rate, in cents.
                  example: 1880
                  nullable: true
                tax_amount_float:
                  type: number
                  description: The collected tax amount, otherwise calculated as total amount cents - discount cent * tax rate, float.
                  example: 18.8
                  nullable: false
                formatted_tax_amount:
                  type: string
                  description: The collected tax amount, otherwise calculated as total amount cents - discount cent * tax rate, formatted.
                  example: €18,80
                  nullable: true
                name:
                  type: string
                  description: The name of the line item. When blank, it gets populated with the name of the associated item (if present).
                  example: Men's Black T-shirt with White Logo (XL)
                  nullable: true
                image_url:
                  type: string
                  description: The image_url of the line item. When blank, it gets populated with the image_url of the associated item (if present, SKU only).
                  example: https://img.yourdomain.com/skus/xYZkjABcde.png
                  nullable: true
                discount_breakdown:
                  type: object
                  description: The discount breakdown for this line item (if calculated).
                  example:
                    '41':
                      name: 10% ALL
                      cents: -900
                      weight: 0.416
                      coupon_code: XXXXXXXX
                  nullable: true
                tax_rate:
                  type: number
                  description: The tax rate for this line item (if calculated).
                  example: 0.22
                  nullable: true
                tax_breakdown:
                  type: object
                  description: The tax breakdown for this line item (if calculated).
                  example:
                    id: '1234'
                    city_amount: '0.0'
                    state_amount: 6.6
                    city_tax_rate: 0.0
                    county_amount: 2.78
                    taxable_amount: 139.0
                    county_tax_rate: 0.02
                    tax_collectable: 10.08
                    special_tax_rate: 0.005
                    combined_tax_rate: 0.0725
                    city_taxable_amount: 0.0
                    state_sales_tax_rate: 0.0475
                    state_taxable_amount: 139.0
                    county_taxable_amount: 139.0
                    special_district_amount: 0.7
                    special_district_taxable_amount: 139.0
                  nullable: true
                item_type:
                  type: string
                  description: The type of the associated item. One of 'skus', 'bundles', 'gift_cards', 'shipments', 'payment_methods', 'adjustments', 'discount_engine_items', 'percentage_discount_promotions', 'free_shipping_promotions', 'buy_x_pay_y_promotions', 'free_gift_promotions', 'fixed_price_promotions', 'external_promotions', 'fixed_amount_promotions', or 'flex_promotions'.
