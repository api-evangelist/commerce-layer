              example: XAyRWNUzyN
            type:
              type: string
              description: The resource's type
              enum:
              - flex_promotions
            links:
              type: object
              properties:
                self:
                  type: string
                  description: URL
            attributes:
              $ref: '#/components/schemas/flexPromotion/properties/data/properties/attributes'
            relationships:
              type: object
              properties:
                coupon_codes_promotion_rule:
                  type: object
                  properties:
                    links:
                      type: object
                      properties:
                        self:
                          type: string
                          description: URL
                        related:
                          type: string
                          description: URL
                    data:
                      type: object
                      properties:
                        type:
                          type: string
                          description: The resource's type
                          enum:
                          - coupon_codes_promotion_rule
                        id:
                          type: string
                          description: The resource ID
                coupons:
                  type: object
                  properties:
                    links:
                      type: object
                      properties:
                        self:
                          type: string
                          description: URL
                        related:
