      parameters:
      - name: skuListPromotionRuleId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/skuListPromotionRuleUpdate'
