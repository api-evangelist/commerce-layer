tags:
- name: pickups
  description: resource type
paths:
  /pickups:
    get:
      operationId: GET/pickups
      summary: List all pickups
      description: List all pickups
      tags:
      - pickups
      responses:
        '200':
          description: A list of pickup objects
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/pickupResponseList'
  /pickups/{pickupId}:
    get:
      operationId: GET/pickups/pickupId
      summary: Retrieve a pickup
      description: Retrieve a pickup
      tags:
      - pickups
      parameters:
      - name: pickupId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      responses:
        '200':
          description: The pickup object
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/pickupResponse'
