                  example: A[KLRZ]|C[AOT]|D[CE]|FL
                  nullable: true
                not_state_code_regex:
                  type: string
                  description: The regex that will be evaluated as negative match for the shipping address state code, max size is 5000.
                  example: A[KLRZ]|C[AOT]
                  nullable: true
                zip_code_regex:
                  type: string
