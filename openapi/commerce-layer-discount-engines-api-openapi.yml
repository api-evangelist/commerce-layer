            attributes:
              type: object
              properties:
                name:
                  type: string
                  description: The discount engine's internal name.
                  example: Personal discount engine
                  nullable: false
                type:
                  type: string
                  description: The discount engine's type.
                  example: talon_one_accounts
                  nullable: false
                  enum:
                  - talon_one_accounts
                manage_gift_cards:
                  type: boolean
                  description: Indicates if the discount engine manages both promotions and gift cards application at once.
                  example: false
                  nullable: true
                created_at:
                  type: string
                  description: Time at which the resource was created.
                  example: '2018-01-01T12:00:00.000Z'
                  nullable: false
                updated_at:
                  type: string
                  description: Time at which the resource was last updated.
                  example: '2018-01-01T12:00:00.000Z'
                  nullable: false
                reference:
                  type: string
