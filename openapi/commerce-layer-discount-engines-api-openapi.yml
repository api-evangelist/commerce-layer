openapi: 3.2.0
info:
  title: Commerce Layer Discount Engines API
  version: 7.10.1
  contact:
    name: API Support
    url: https://commercelayer.io
    email: support@commercelayer.io
  description: Headless Commerce for Global Brands.
servers:
- url: https://{your_organization_slug}.commercelayer.io/api
  description: API
- url: https://core.commercelayer.io/users/sign_in
  description: Sign in
- url: https://docs.commercelayer.io/api
  description: API reference
security:
- bearerAuth: []
tags:
- name: discount_engines
  description: resource type
paths:
  /discount_engines:
    get:
      operationId: GET/discount_engines
      summary: List all discount engines
      description: List all discount engines
      tags:
      - discount_engines
      responses:
        '200':
          description: A list of discount engine objects
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/discountEngineResponseList'
  /discount_engines/{discountEngineId}:
    get:
      operationId: GET/discount_engines/discountEngineId
      summary: Retrieve a discount engine
      description: Retrieve a discount engine
      tags:
      - discount_engines
      parameters:
      - name: discountEngineId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      responses:
        '200':
          description: The discount engine object
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/discountEngineResponse'
