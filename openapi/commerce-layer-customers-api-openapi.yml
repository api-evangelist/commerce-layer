openapi: 3.2.0
info:
  title: Commerce Layer Customers API
  version: 7.10.1
  contact:
    name: API Support
    url: https://commercelayer.io
    email: support@commercelayer.io
  description: Headless Commerce for Global Brands.
servers:
- url: https://{your_organization_slug}.commercelayer.io/api
  description: API
- url: https://core.commercelayer.io/users/sign_in
  description: Sign in
- url: https://docs.commercelayer.io/api
  description: API reference
security:
- bearerAuth: []
tags:
- name: customers
  description: resource type
paths:
  /customers:
    get:
      operationId: GET/customers
      summary: List all customers
      description: List all customers
      tags:
      - customers
      responses:
        '200':
          description: A list of customer objects
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/customerResponseList'
    post:
      operationId: POST/customers
      summary: Create a customer
      description: Create a customer
      tags:
      - customers
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/customerCreate'
      responses:
        '201':
          description: The created customer object
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/customerResponse'
  /customers/{customerId}:
    get:
      operationId: GET/customers/customerId
      summary: Retrieve a customer
      description: Retrieve a customer
      tags:
      - customers
      parameters:
      - name: customerId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      responses:
        '200':
          description: The customer object
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/customerResponse'
    patch:
      operationId: PATCH/customers/customerId
      summary: Update a customer
      description: Update a customer
      tags:
      - customers
      parameters:
      - name: customerId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/customerUpdate'
      responses:
        '200':
          description: The updated customer object
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/customerResponse'
    delete:
      operationId: DELETE/customers/customerId
      summary: Delete a customer
      description: Delete a customer
      tags:
      - customers
      parameters:
      - name: customerId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      responses:
        '204':
          description: No content
