openapi: 3.2.0
info:
  title: Commerce Layer Shipments API
  version: 7.10.1
  contact:
    name: API Support
    url: https://commercelayer.io
    email: support@commercelayer.io
  description: Headless Commerce for Global Brands.
servers:
- url: https://{your_organization_slug}.commercelayer.io/api
  description: API
- url: https://core.commercelayer.io/users/sign_in
  description: Sign in
- url: https://docs.commercelayer.io/api
  description: API reference
security:
- bearerAuth: []
tags:
- name: shipments
  description: resource type
paths:
  /shipments:
    get:
      operationId: GET/shipments
      summary: List all shipments
      description: List all shipments
      tags:
      - shipments
      responses:
        '200':
          description: A list of shipment objects
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/shipmentResponseList'
    post:
      operationId: POST/shipments
      summary: Create a shipment
      description: Create a shipment
      tags:
      - shipments
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/shipmentCreate'
      responses:
        '201':
          description: The created shipment object
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/shipmentResponse'
  /shipments/{shipmentId}:
    get:
      operationId: GET/shipments/shipmentId
      summary: Retrieve a shipment
      description: Retrieve a shipment
      tags:
      - shipments
      parameters:
      - name: shipmentId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      responses:
        '200':
          description: The shipment object
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/shipmentResponse'
    patch:
      operationId: PATCH/shipments/shipmentId
      summary: Update a shipment
      description: Update a shipment
      tags:
      - shipments
      parameters:
      - name: shipmentId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/shipmentUpdate'
      responses:
        '200':
          description: The updated shipment object
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/shipmentResponse'
    delete:
      operationId: DELETE/shipments/shipmentId
      summary: Delete a shipment
      description: Delete a shipment
      tags:
      - shipments
      parameters:
      - name: shipmentId
        in: path
        schema:
          type: string
        required: true
        description: The resource's id
      responses:
        '204':
          description: No content
