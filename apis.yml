- type: Features
  data:
  - 'Headless, API-first commerce platform with stateless OAuth 2.0 checkout to sell anywhere — web, mobile,
    chatbot, AI agent, IoT, in-store kiosk'
  - 'JSON:API (jsonapi.org/format/) compliant Core API with 917 path operations across 130+ top-level resources
    on a single OpenAPI 3.1 spec'
  - 'Native multi-market and multi-currency: independent markets, merchants, stores, price lists, inventory
    models, payment methods, shipping zones, and tax calculators per market'
  - 'Native subscriptions and recurring orders: order subscriptions, customer subscriptions, order copies,
    in-stock subscriptions, subscription models'
  - 'Promotion engine: BXGY, percentage discount, fixed amount, fixed price, free gift, free shipping, custom
    promotions, flex promotions, plus gift cards, coupons, coupon recipients, and SKU lists / order-amount
    rules'
  - 'Built-in inventory: stock items, stock locations, inventory models, inventory return locations, stock
    transfers, stock reservations, reserved stocks, delivery lead times'
  - 'First-party payment integrations: Adyen, Stripe, Braintree, PayPal, Klarna, Checkout.com, Axerve,
    Satispay, plus external/manual gateways'
  - 'First-party tax integrations: Avalara, TaxJar, Vertex, Stripe Tax, plus manual and external calculators'
  - 'First-party shipping integrations: 100+ carrier accounts via the carrier accounts schema; EasyPost
    pickups; Google and Bing geocoders'
  - 'Real-time webhooks plus an Event Stream Hub (SSE) with resource-based and time-based replay'
  - 'Rules engine with public JSON schemas for order rules and price list rules'
  - 'Provisioning API (48 ops): organizations, memberships, roles, API credentials, identity providers (SSO)'
  - 'Metrics API: breakdown, date_breakdown, stats, search, export queries over orders / carts / returns /
    usage, plus FBT analysis'
  - 'Local MCP server for the Metrics API (commercelayer/mcp-server-metrics) for AI-agent access'
  - 'Hosted micro frontends: checkout, cart, my-account, microstore, identity — each open-source on GitHub'
  - 'Imports, exports, and cleanups for bulk resource management'
  - 'Tagging across resources; sparse fieldsets; filtering, sorting, pagination, and include parameters per
    JSON:API'
  - 'Official SDKs: JavaScript/TypeScript (commercelayer-sdk), JS Auth, Ruby (commercelayer_ruby), Provisioning
    SDK, plus React Components and drop-in.js'
  - 'CLI with 15+ plugins (resources, webhooks, imports, exports, metrics, checkout, orders, provisioning,
    microstore, seeder, cleanups, triggers, tags, links, token)'
  - 'CMS integrations: Sanity, Contentful, Contentstack, DatoCMS, Gatsby'
  - 'Dashboard apps: orders, customers, shipments, returns, promotions, imports, exports, webhooks, skus,
    sku-lists, price-lists, inventory, stock-transfers, tags'
  - 'Public unauthenticated endpoints for resources discovery, OpenAPI download, carrier schema, order/price
    rules schemas, organization config schema, OAuth data schema'
  - 'Free Developer plan with free live orders/month; Enterprise plan with dedicated support, custom roles,
    custom identity provider, SLAs; optional Distributed OMS and Promotion Engine add-ons; pro-bono plans
    for selected non-profits'
  - 'OAuth 2.0 grants: client_credentials, password, authorization_code, refresh_token, JWT bearer'
  - 'Multi-environment: live and test environments with separate rate limits'
