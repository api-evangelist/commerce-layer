position: Consuming
description: Commerce Layer is the headless, multi-market commerce API used by global
  brands to sell everywhere — web, mobile, in-store, chatbot, AI agent, and IoT. The
  company exposes a JSON:API-compliant Core API with 130+ top-level resources covering
  orders, line items, SKUs, bundles, prices, markets, stores, inventory, customers,
  payments (Adyen, Stripe, Braintree, PayPal, Klarna, Checkout.com), tax calculation
  (Avalara, TaxJar, Vertex, Stripe Tax), shipping, promotions, subscriptions, returns,
  and webhooks. The platform also ships a Provisioning API for organizations/SSO/credentials
  and a Metrics API for analytics (with a local MCP server for AI agents), plus hosted
  micro-frontends, dashboard apps, a CLI, CMS integrations, and SDKs for JavaScript/TypeScript,
  Ruby, React, and drop-in.js.
