  description: The Commerce Layer Core API is the JSON:API-compliant REST API that powers headless commerce. It
    exposes 130+ top-level resources covering orders, line items, SKUs, bundles, prices, price lists, markets,
    stores, inventory (stock items, locations, transfers), customers, customer groups, customer subscriptions,
    payment gateways (Adyen, Stripe, Braintree, PayPal, Klarna, Checkout.com, Axerve, Satispay), payment methods,
    tax calculators (Avalara, TaxJar, Vertex, Stripe Tax), shipping methods, shipping zones, carrier accounts,
    geocoders (Google, Bing), promotions (fixed amount, percentage, free gift, free shipping, BXGY, flex),
    gift cards, coupons, returns, parcels, packages, webhooks, imports, exports, and tags. 917 path operations
    across the live OpenAPI 3.1 specification.
