  description: Programmatic provisioning surface for Commerce Layer organizations, memberships, roles, API
    credentials, application memberships, identity providers (SSO), permissions, and user invitations. 48 path
    operations. Required for headless onboarding flows, infrastructure-as-code organization management, and
    enterprise identity federation. Available on Developer and Enterprise plans (Provisioning API access is an
    enterprise feature).
