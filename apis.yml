  description: Analytics surface over Commerce Layer's ecommerce history. Five query types (breakdown,
    date_breakdown, stats, search, export) across four domains (orders, carts, returns, usage) plus
    frequently-bought-together (FBT) analysis helpers. Useful for KPI dashboards, cohort and funnel reporting,
    catalog merchandising signals, and feeding downstream warehouses. Commerce Layer also publishes a local MCP
    server that exposes the Metrics API to AI agents.
